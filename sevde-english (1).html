<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>SEVDE ENGLISH — Ton coach personnel pour progresser en anglais</title>
<style>
:root{
 --bg:#f6f6f7;--card:#ffffff;--text:#111114;--muted:#6b6b76;--line:#e6e6ea;
 --accent:#111114;--accent-txt:#ffffff;--soft:#eef0f5;--ok:#16a34a;--ok-bg:#e8f7ee;--ko:#dc2626;--ko-bg:#fdeaea;
 --warm:#f7efe6;--rose:#fbe9ee;--mint:#e6f6f1;--sky:#e8f0fb;--lilac:#efeafb;--gold:#fbf3d9;
 --r:20px;--sh:0 4px 20px rgba(0,0,0,.06);--sh2:0 10px 30px rgba(0,0,0,.10);
}
[data-theme="dark"]{
 --bg:#0d0d10;--card:#17171c;--text:#f4f4f6;--muted:#9a9aa6;--line:#26262e;
 --accent:#f4f4f6;--accent-txt:#111114;--soft:#20202a;--ok:#34d399;--ok-bg:#0f2a1f;--ko:#f87171;--ko-bg:#2d1414;
 --warm:#26201a;--rose:#2a1a1f;--mint:#15251f;--sky:#171f2b;--lilac:#1f1a2b;--gold:#2a2517;
 --sh:0 4px 20px rgba(0,0,0,.4);--sh2:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}h2{font-size:22px;font-weight:750}h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.app{display:flex;min-height:100vh;min-height:100dvh}
/* SIDEBAR */
.side{width:240px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.brand{padding:4px 10px 18px}
.brand h1{font-size:20px;letter-spacing:.06em}
.brand p{font-size:12px;color:var(--muted)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--muted);transition:background .15s,color .15s;text-align:left}
.nav button:hover{background:var(--soft);color:var(--text)}
.nav button.active{background:var(--accent);color:var(--accent-txt)}
.nav .ic{font-size:17px;width:24px;text-align:center}
.side .xpbox{margin-top:auto;padding:14px;border-radius:14px;background:var(--soft);font-size:13px}
.main{flex:1;min-width:0;padding:28px 32px 100px;max-width:1080px;margin:0 auto;width:100%}
/* TOP BAR mobile */
.topbar{display:none;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h1{font-size:17px;letter-spacing:.06em}
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 8px;border-radius:12px;flex:1}
.tabbar button .ic{font-size:20px}
.tabbar button.active{color:var(--text);background:var(--soft)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .inner{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheet .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet .grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;background:var(--soft);font-weight:600;font-size:12.5px}
.sheet .grid button .ic{font-size:24px}
.sheet .grid button.active{background:var(--accent);color:var(--accent-txt)}
@media (max-width:900px){
 .side{display:none}.topbar{display:flex}.tabbar{display:flex}
 .main{padding:18px 16px 110px}
 h1{font-size:24px}
}
/* CARDS */
.card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--sh);border:1px solid var(--line)}
.card.tint-warm{background:var(--warm)}.card.tint-rose{background:var(--rose)}.card.tint-mint{background:var(--mint)}.card.tint-sky{background:var(--sky)}.card.tint-lilac{background:var(--lilac)}.card.tint-gold{background:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:700px){.grid3,.grid4{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stat{padding:16px 18px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.ok > i{background:var(--ok)}
.bar.thin{height:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--soft);font-size:12.5px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.ko{background:var(--ko-bg);color:var(--ko)}
.pill.lvl{background:var(--accent);color:var(--accent-txt)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-txt);transition:transform .1s,opacity .15s;min-height:48px}
.btn:hover{opacity:.9}.btn:active{transform:scale(.98)}
.btn.sec{background:var(--soft);color:var(--text)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.ok{background:var(--ok);color:#fff}.btn.ko{background:var(--ko);color:#fff}
.btn.full{width:100%}
.btn.sm{padding:9px 14px;font-size:13.5px;min-height:38px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:transform .1s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.speaking{background:var(--accent);color:var(--accent-txt);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:13.5px;transition:all .15s;min-height:40px}
.chip:hover{border-color:var(--text)}
.chip.active{background:var(--accent);color:var(--accent-txt);border-color:var(--accent)}
.seg{display:inline-flex;background:var(--soft);padding:4px;border-radius:12px;gap:2px}
.seg button{padding:8px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.active{background:var(--card);color:var(--text);box-shadow:var(--sh)}
/* EXERCISE */
.ex-wrap{max-width:680px;margin:0 auto}
.ex-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ex-head .bar{flex:1}
.ex-q{font-size:22px;font-weight:700;margin:10px 0 18px;line-height:1.35}
.ex-q.big{font-size:28px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;padding:16px 18px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:16.5px;font-weight:600;transition:all .15s;min-height:56px;display:flex;align-items:center;gap:12px}
.opt:hover{border-color:var(--text)}
.opt .k{width:28px;height:28px;border-radius:8px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--ko-bg);border-color:var(--ko)}
.opt:disabled{cursor:default}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;border-radius:16px;background:var(--soft);margin-bottom:12px}
.tiles.answer{background:var(--card);border:2px dashed var(--line)}
.tile{padding:10px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:16px;box-shadow:var(--sh);transition:transform .1s;min-height:44px}
.tiles.answer .tile{background:var(--accent);color:var(--accent-txt);border-color:var(--accent)}
.tile:active{transform:scale(.95)}
.tile.used{opacity:.25;pointer-events:none}
.txt{width:100%;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:17px;min-height:56px}
.txt:focus{border-color:var(--text)}
.feedback{margin-top:16px;padding:16px 18px;border-radius:16px;animation:fadeUp .25s ease}
.feedback.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.feedback.ko{background:var(--ko-bg);border:1px solid var(--ko)}
.feedback h4{margin-bottom:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .3s ease}
/* TOAST */
.toasts{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(420px,92vw)}
.toast{background:var(--card);color:var(--text);padding:14px 18px;border-radius:16px;box-shadow:var(--sh2);border:1px solid var(--line);font-weight:600;font-size:14.5px;line-height:1.4;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2);text-align:center;white-space:pre-line}
.toast.ok{border-left:5px solid var(--ok)}.toast.ko{border-left:5px solid #f59e0b}.toast.gold{border-left:5px solid #eab308;background:var(--gold)}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
/* MISC */
.vocab-card{display:flex;flex-direction:column;gap:8px;padding:18px}
.vocab-card .en{font-size:20px;font-weight:800}
.vocab-card .fr{color:var(--muted);font-size:15px}
.vocab-card .exm{font-size:14px;font-style:italic;padding:8px 12px;background:var(--soft);border-radius:10px}
.vocab-card.learned{border-color:var(--ok)}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:40px;padding:4px 0}
.check input{width:20px;height:20px;accent-color:var(--ok)}
.m-dots{display:flex;gap:3px}
.m-dots i{width:8px;height:8px;border-radius:99px;background:var(--line)}
.m-dots i.on{background:var(--ok)}
.hidden-fr{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.hidden-fr.show{filter:none}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.list-item .body{flex:1;min-width:0}
.cat-btn{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left;box-shadow:var(--sh);transition:transform .12s}
.cat-btn:hover{transform:translateY(-2px)}
.cat-btn .ic{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cat-btn .body{flex:1;min-width:0}
.cat-btn .body b{display:block;font-size:15px}
.cat-btn .body span{font-size:12.5px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;padding:6px 0;margin-bottom:8px;font-size:14px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.badge .ic{font-size:30px}
.badge.locked{opacity:.35;filter:grayscale(1)}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .c i{width:100%;max-width:26px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px;transition:height .5s}
.chart .c span{font-size:10px;color:var(--muted)}
.skill-row{display:grid;grid-template-columns:120px 1fr 60px 44px;align-items:center;gap:12px;padding:8px 0}
@media(max-width:600px){.skill-row{grid-template-columns:90px 1fr 46px 40px;font-size:14px}}
.mission li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);list-style:none}
.mission li:last-child{border:0}
.mission .ck{width:24px;height:24px;border-radius:8px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.mission .ck.done{background:var(--ok);color:#fff}
.mission ul{margin:0;padding:0}
.onb{max-width:560px;margin:40px auto;padding:0 16px}
.onb .q{margin-bottom:8px}
.onb .opts{margin-bottom:24px}
.convo{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.bubble{max-width:85%;padding:12px 16px;border-radius:18px;font-size:16px;line-height:1.4;animation:fadeUp .3s}
.bubble.npc{background:var(--soft);align-self:flex-start;border-bottom-left-radius:6px}
.bubble.me{background:var(--accent);color:var(--accent-txt);align-self:flex-end;border-bottom-right-radius:6px}
.bubble .who{font-size:11px;font-weight:700;opacity:.6;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--card);border-radius:24px;padding:28px;max-width:480px;width:100%;box-shadow:var(--sh2);animation:fadeUp .25s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;width:8px;height:14px;top:-20px;animation:fall 2.2s linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.sound-card{padding:16px}
.sound-card .s{font-size:26px;font-weight:800}
.sound-card .words{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sound-card .words button{padding:8px 12px;border-radius:10px;background:var(--soft);font-weight:600;font-size:14px}
.sound-card .words button:hover{background:var(--accent);color:var(--accent-txt)}
.letter{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);transition:transform .1s;gap:2px}
.letter:active{transform:scale(.95)}
.letter b{font-size:30px}.letter span{font-size:11px;color:var(--muted)}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:700px){.grid6{grid-template-columns:repeat(4,1fr)}}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr.irr td:first-child{font-weight:700}
.hero{padding:28px;border-radius:24px;background:linear-gradient(135deg,var(--card),var(--soft));border:1px solid var(--line)}
.hero h1{font-size:30px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:6px 0 10px}
.lvlbadge{display:inline-flex;align-items:center;justify-content:center;padding:6px 14px;border-radius:12px;background:var(--accent);color:var(--accent-txt);font-weight:800;font-size:20px;letter-spacing:.04em}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.tag.A1{background:#e6f6f1;color:#0f7a4f}.tag.A2{background:#e8f0fb;color:#1d4ed8}.tag.B1{background:#efeafb;color:#6d28d9}.tag.B2{background:#fbe9ee;color:#be123c}
[data-theme="dark"] .tag.A1{background:#15251f;color:#5fd3a5}[data-theme="dark"] .tag.A2{background:#171f2b;color:#8ab4ff}[data-theme="dark"] .tag.B1{background:#1f1a2b;color:#c4a7ff}[data-theme="dark"] .tag.B2{background:#2a1a1f;color:#ff8fa8}
.mic{width:80px;height:80px;border-radius:50%;background:var(--accent);color:var(--accent-txt);font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto;transition:transform .15s}
.mic.on{background:var(--ko);animation:pulse 1s infinite}
details summary{cursor:pointer;font-weight:700;padding:8px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
.kbd{font-size:11px;padding:2px 6px;border-radius:5px;background:var(--soft);color:var(--muted)}
.divider{height:1px;background:var(--line);margin:14px 0}
.result-ring{width:130px;height:130px;margin:0 auto 12px}
.pct{font-size:36px;font-weight:800}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
</style>
</head>

 ex:[
 {q:"___ do you live? – In Izmir.",opts:["What","Where","When"],a:"Where",ex:"Lieu → where."},
 {q:"___ is your birthday? – In May.",opts:["Where","When","Who"],a:"When",ex:"Moment → when."},
 {q:"___ are you sad?",opts:["Why","What","Which"],a:"Why",ex:"Raison → why."},
 {q:"___ books do you have?",opts:["How much","How many","How"],a:"How many",ex:"Books = dénombrable → how many."},
 {q:"___ old are you?",opts:["What","How","Which"],a:"How",ex:"How old = quel âge."},
 {q:"Find the mistake:",opts:["Where you live?","Where do you live?","Where does she live?"],a:"Where you live?",ex:"Il manque l'auxiliaire do."},
 {q:"___ is that man? – He's my uncle.",opts:["Who","What","Where"],a:"Who",ex:"Personne → who."}
]},
{id:"negation",lvl:"A1",title:"La négation",tag:"Négation",
 explain:"Avec BE : am not / isn't / aren't. Avec les autres verbes au présent : don't / doesn't + base. Avec can : can't. Au passé : wasn't / weren't, didn't + base.",
 examples:[["I'm not tired.","Je ne suis pas fatiguée."],["She doesn't like tea.","Elle n'aime pas le thé."],["We didn't go.","Nous ne sommes pas allés."]],
 tip:"Une seule négation par phrase : « I don't have anything » (pas « nothing »).",
 ex:[
 {q:"I ___ like fish.",opts:["don't","not","am not"],a:"don't",ex:"Verbe like → don't."},
 {q:"She ___ here today.",opts:["doesn't","isn't","don't"],a:"isn't",ex:"Be → isn't."},
 {q:"They ___ speak French.",opts:["doesn't","aren't","don't"],a:"don't",ex:"They + verbe → don't."},
 {q:"He ___ come yesterday.",opts:["didn't","doesn't","don't"],a:"didn't",ex:"Passé → didn't."},
 {q:"Find the mistake:",opts:["I don't know nothing.","I don't know anything.","I know nothing."],a:"I don't know nothing.",ex:"Double négation interdite."}
]},
{id:"possessives",lvl:"A1",title:"Les possessifs",tag:"Possessifs",
 explain:"Adjectifs possessifs : my, your, his (à lui), her (à elle), its, our, their. Le possessif dépend du POSSESSEUR, pas de l'objet. Génitif : Sevde's book = le livre de Sevde.",
 examples:[["This is my husband.","C'est mon mari."],["Her name is Sevde.","Son nom (à elle) est Sevde."],["Umit's car is red.","La voiture d'Umit est rouge."]],
 tip:"His = à lui, her = à elle. « Son livre » : his book si c'est à un homme, her book si c'est à une femme.",
 ex:[
 {q:"Sevde loves ___ husband.",opts:["his","her","its"],a:"her",ex:"Sevde = femme → her."},
 {q:"Umit loves ___ wife.",opts:["his","her","their"],a:"his",ex:"Umit = homme → his."},
 {q:"We love ___ house.",opts:["our","their","us"],a:"our",ex:"We → our."},
 {q:"The dog is eating ___ food.",opts:["his","its","it's"],a:"its",ex:"Animal → its (sans apostrophe)."},
 {q:"This is ___ car. (the car of my parents)",opts:["my parent's","my parents'","my parents"],a:"my parents'",ex:"Pluriel en -s → apostrophe après."},
 {q:"Find the mistake:",opts:["Their house is big.","They're house is big.","Her house is big."],a:"They're house is big.",ex:"They're = they are. Possessif = their."}
]},
{id:"prepositions",lvl:"A1",title:"Les prépositions de lieu et de temps",tag:"Prépositions",
 explain:"Lieu : in (dans, une ville/pays), on (sur), under (sous), next to (à côté), between (entre), in front of (devant), behind (derrière), at (à un endroit précis). Temps : at 8 o'clock, on Monday, in May / in 2024 / in the morning.",
 examples:[["The keys are on the table.","Les clés sont sur la table."],["I live in Izmir.","J'habite à Izmir."],["See you on Monday at 9.","À lundi 9 heures."]],
 tip:"Temps : AT + heure, ON + jour, IN + mois/année/moment de la journée (mais : at night).",
 ex:[
 {q:"The meeting is ___ Monday.",opts:["at","on","in"],a:"on",ex:"Jour → on."},
 {q:"I wake up ___ 7 o'clock.",opts:["at","on","in"],a:"at",ex:"Heure → at."},
 {q:"My birthday is ___ May.",opts:["at","on","in"],a:"in",ex:"Mois → in."},
 {q:"The cat is ___ the table.",opts:["under","between","at"],a:"under",ex:"Sous → under."},
 {q:"The bank is ___ the pharmacy and the school.",opts:["between","next","on"],a:"between",ex:"Entre deux → between."},
 {q:"I live ___ Turkey.",opts:["at","on","in"],a:"in",ex:"Pays → in."},
 {q:"We watch TV ___ the evening.",opts:["at","on","in"],a:"in",ex:"Moment de la journée → in (sauf at night)."}
]},
{id:"past_simple",lvl:"A2",title:"Le past simple",tag:"Past simple",
 explain:"Pour une action terminée à un moment précis du passé (yesterday, last week, in 2020). Verbes réguliers : +ed (worked, played). Irréguliers : go → went, see → saw, have → had. Négation : didn't + base. Question : Did + sujet + base. Be : was / were.",
 examples:[["I visited London last year.","J'ai visité Londres l'année dernière."],["She went to the cinema.","Elle est allée au cinéma."],["Did you see him?","L'as-tu vu ?"],["We didn't go.","Nous ne sommes pas allés."]],
 tip:"Après did / didn't, le verbe revient à la base : Did you go? (pas « Did you went? »).",
 ex:[
 {q:"Yesterday I ___ to the market.",opts:["go","went","goed"],a:"went",ex:"Go est irrégulier → went."},
 {q:"She ___ TV last night.",opts:["watch","watched","watches"],a:"watched",ex:"Régulier → +ed."},
 {q:"___ you see the film?",opts:["Do","Did","Were"],a:"Did",ex:"Question au passé → did."},
 {q:"We ___ happy yesterday.",opts:["was","were","are"],a:"were",ex:"We → were."},
 {q:"Find the mistake:",opts:["Did you went?","Did you go?","You went."],a:"Did you went?",ex:"Après did → base verbale."},
 {q:"He ___ come to the party.",opts:["didn't","doesn't","wasn't"],a:"didn't",ex:"Négation passé → didn't + come."},
 {q:"I ___ a coffee this morning.",opts:["have","had","has"],a:"had",ex:"Have → had."},
 {q:"They ___ in Paris in 2020.",opts:["live","lived","living"],a:"lived",ex:"Moment précis du passé → lived."},
 {q:"She ___ a letter to her friend.",opts:["wrote","writed","written"],a:"wrote",ex:"Write → wrote."},
 {q:"I ___ tired last night.",opts:["was","were","did"],a:"was",ex:"I → was."}
]},
{id:"future",lvl:"A2",title:"Le futur avec WILL",tag:"Will",
 explain:"Will + base verbale, pour tous les sujets. Utilisé pour : une décision spontanée (I'll help you!), une prédiction (It will rain), une promesse (I will call you). Négation : won't. Question : Will you...?",
 examples:[["I will call you tomorrow.","Je t'appellerai demain."],["It won't rain.","Il ne pleuvra pas."],["Will you come?","Viendras-tu ?"]],
 tip:"'ll est la contraction de will : I'll, you'll, she'll. Won't = will not.",
 ex:[
 {q:"I ___ help you with your suitcase.",opts:["will","am","do"],a:"will",ex:"Décision spontanée → will."},
 {q:"She ___ be here tomorrow.",opts:["will","wills","will to"],a:"will",ex:"Will ne change jamais."},
 {q:"It ___ rain tomorrow, don't worry.",opts:["won't","don't","isn't"],a:"won't",ex:"Négation futur → won't."},
 {q:"___ you marry me?",opts:["Will","Do","Are"],a:"Will",ex:"Question futur → Will you...?"},
 {q:"Find the mistake:",opts:["I will to go.","I will go.","I'll go."],a:"I will to go.",ex:"Pas de « to » après will."}
]},
{id:"going_to",lvl:"A2",title:"Le futur avec GOING TO",tag:"Going to",
 explain:"Be going to + base verbale : pour un projet déjà décidé ou une prédiction basée sur ce qu'on voit. I am going to visit my parents. Look at the clouds! It's going to rain.",
 examples:[["I'm going to study tonight.","Je vais étudier ce soir."],["They are going to move.","Ils vont déménager."],["Are you going to come?","Vas-tu venir ?"]],
 tip:"Will = décision sur le moment. Going to = projet déjà prévu. « What are you going to do this weekend? »",
 ex:[
 {q:"We ___ visit Rome next summer. (projet)",opts:["are going to","will","going to"],a:"are going to",ex:"Projet prévu → be going to."},
 {q:"Look at the sky! It ___ rain.",opts:["is going to","will to","goes to"],a:"is going to",ex:"Prédiction évidente → going to."},
 {q:"___ you going to buy a car?",opts:["Are","Do","Will"],a:"Are",ex:"Be going to → Are you going to...?"},
 {q:"She ___ to start a new job.",opts:["is going","going","will going"],a:"is going",ex:"Be + going to."},
 {q:"Find the mistake:",opts:["I going to sleep.","I'm going to sleep.","I am going to sleep."],a:"I going to sleep.",ex:"Il manque le verbe be."}
]},
{id:"comparatives",lvl:"A2",title:"Les comparatifs",tag:"Comparatifs",
 explain:"Adjectifs courts (1 syllabe) : +er + than (taller than, cheaper than). Adjectifs longs : more + adj + than (more expensive than). Irréguliers : good → better, bad → worse, far → further. Égalité : as ... as.",
 examples:[["London is bigger than Izmir.","Londres est plus grande qu'Izmir."],["This hotel is more expensive.","Cet hôtel est plus cher."],["Tea is better than coffee.","Le thé est meilleur que le café."]],
 tip:"Adjectif en -y → -ier : happy → happier, easy → easier.",
 ex:[
 {q:"My car is ___ than yours.",opts:["fast","faster","more fast"],a:"faster",ex:"Adjectif court → +er."},
 {q:"This book is ___ than that one.",opts:["interestinger","more interesting","interesting"],a:"more interesting",ex:"Adjectif long → more."},
 {q:"Her English is ___ than mine.",opts:["gooder","better","more good"],a:"better",ex:"Good → better."},
 {q:"Today is ___ than yesterday.",opts:["hoter","hotter","more hot"],a:"hotter",ex:"Hot → hotter (double t)."},
 {q:"Find the mistake:",opts:["She is taller than me.","She is more tall than me.","She is as tall as me."],a:"She is more tall than me.",ex:"Tall est court → taller."},
 {q:"This exercise is ___ than the last one.",opts:["easyer","easier","more easy"],a:"easier",ex:"-y → -ier."}
]},
{id:"superlatives",lvl:"A2",title:"Les superlatifs",tag:"Superlatifs",
 explain:"Le plus... : the + adj-EST (the tallest, the cheapest) pour les courts. The most + adj pour les longs (the most beautiful). Irréguliers : the best, the worst, the furthest.",
 examples:[["Istanbul is the biggest city in Turkey.","Istanbul est la plus grande ville de Turquie."],["It's the most beautiful place.","C'est le plus bel endroit."],["Umit is the best.","Umit est le meilleur."]],
 tip:"Après un superlatif, on utilise souvent « in » : the best restaurant IN the city.",
 ex:[
 {q:"This is ___ hotel in town.",opts:["the cheaper","the cheapest","the most cheap"],a:"the cheapest",ex:"Court → the + -est."},
 {q:"She is ___ person I know.",opts:["the most kind","the kindest","the kinder"],a:"the kindest",ex:"Kind est court → kindest."},
 {q:"It's ___ film of the year.",opts:["the best","the goodest","the better"],a:"the best",ex:"Good → the best."},
 {q:"This is ___ restaurant in Izmir.",opts:["the expensivest","the most expensive","most expensive"],a:"the most expensive",ex:"Long → the most."},
 {q:"Find the mistake:",opts:["the worst day","the baddest day","the happiest day"],a:"the baddest day",ex:"Bad → the worst."}
]},
{id:"quantifiers",lvl:"A2",title:"Les quantifieurs",tag:"Quantifieurs",
 explain:"Some (affirmatif) / any (négatif, question). Much (indénombrable : much time), many (dénombrable : many friends). A lot of (les deux). A few (dénombrable : a few friends), a little (indénombrable : a little money).",
 examples:[["I have some money.","J'ai de l'argent."],["Do you have any questions?","As-tu des questions ?"],["There isn't much time.","Il n'y a pas beaucoup de temps."]],
 tip:"Dans une offre polie, on utilise some même dans une question : « Would you like some tea? »",
 ex:[
 {q:"Do you have ___ brothers?",opts:["some","any","much"],a:"any",ex:"Question → any."},
 {q:"I have ___ friends in London.",opts:["a few","a little","much"],a:"a few",ex:"Friends = dénombrable → a few."},
 {q:"There isn't ___ milk left.",opts:["many","much","a few"],a:"much",ex:"Milk = indénombrable → much."},
 {q:"How ___ people came?",opts:["much","many","little"],a:"many",ex:"People = dénombrable → many."},
 {q:"I need ___ water.",opts:["a few","some","many"],a:"some",ex:"Affirmatif + indénombrable → some."},
 {q:"Find the mistake:",opts:["I don't have any money.","I have much friends.","I have a lot of friends."],a:"I have much friends.",ex:"Friends → many / a lot of."}
]},
{id:"present_perfect_a2",lvl:"A2",title:"Le present perfect (introduction)",tag:"Present perfect",
 explain:"Have / has + participe passé. Pour une expérience de vie (sans date) ou un résultat présent. I have visited Paris. She has just arrived. Mots-clés : ever, never, just, already, yet.",
 examples:[["I have been to London.","Je suis déjà allée à Londres."],["Have you ever eaten sushi?","As-tu déjà mangé des sushis ?"],["She has just left.","Elle vient de partir."]],
 tip:"Pas de moment précis avec le present perfect ! « I have seen him yesterday » est FAUX → I saw him yesterday.",
 ex:[
 {q:"I ___ never been to Japan.",opts:["have","has","am"],a:"have",ex:"I → have + been."},
 {q:"She ___ just finished her work.",opts:["have","has","is"],a:"has",ex:"She → has."},
 {q:"Have you ever ___ sushi?",opts:["eat","ate","eaten"],a:"eaten",ex:"Participe passé de eat → eaten."},
 {q:"Find the mistake:",opts:["I have seen him yesterday.","I saw him yesterday.","I have seen him."],a:"I have seen him yesterday.",ex:"Moment précis → past simple."},
 {q:"They ___ already left.",opts:["have","has","had"],a:"have",ex:"They → have."},
 {q:"We haven't finished ___.",opts:["already","yet","just"],a:"yet",ex:"Négation → yet en fin de phrase."}
]},
{id:"modals",lvl:"A2",title:"Les modaux : must, should, have to, may",tag:"Modaux",
 explain:"Must = obligation forte (You must stop). Have to = obligation externe (I have to work). Should = conseil (You should rest). May / might = possibilité (It may rain). Mustn't = interdiction. Don't have to = pas obligé.",
 examples:[["You should see a doctor.","Tu devrais voir un médecin."],["I have to work tomorrow.","Je dois travailler demain."],["You mustn't smoke here.","Il est interdit de fumer ici."]],
 tip:"Mustn't = interdit. Don't have to = pas la peine. Grosse différence !",
 ex:[
 {q:"You look tired. You ___ rest.",opts:["should","must to","have"],a:"should",ex:"Conseil → should."},
 {q:"You ___ smoke in the hospital. (interdit)",opts:["don't have to","mustn't","shouldn't to"],a:"mustn't",ex:"Interdiction → mustn't."},
 {q:"It's Sunday. I ___ work. (pas obligée)",opts:["mustn't","don't have to","can't"],a:"don't have to",ex:"Pas d'obligation → don't have to."},
 {q:"It ___ rain later, take an umbrella.",opts:["might","must","should"],a:"might",ex:"Possibilité → might."},
 {q:"Find the mistake:",opts:["You should go.","You must to go.","You have to go."],a:"You must to go.",ex:"Pas de to après must."}
]},
{id:"adverbs",lvl:"A2",title:"Les adverbes",tag:"Adverbes",
 explain:"Adjectif + ly = adverbe (slow → slowly, careful → carefully). Irréguliers : good → well, fast → fast, hard → hard. Adverbes de fréquence (always, usually, often, sometimes, never) se placent AVANT le verbe, mais APRÈS be.",
 examples:[["She speaks slowly.","Elle parle lentement."],["He plays well.","Il joue bien."],["I always drink tea.","Je bois toujours du thé."],["She is never late.","Elle n'est jamais en retard."]],
 tip:"« Good » est un adjectif, « well » un adverbe : a good singer / she sings well.",
 ex:[
 {q:"She sings very ___.",opts:["good","well","goodly"],a:"well",ex:"Adverbe de good → well."},
 {q:"Drive ___, please.",opts:["careful","carefully","care"],a:"carefully",ex:"Adverbe → -ly."},
 {q:"I ___ go to the gym on Mondays.",opts:["go usually","usually","am usually"],a:"usually",ex:"Fréquence avant le verbe."},
 {q:"She ___ late.",opts:["is never","never is","never"],a:"is never",ex:"Après be."},
 {q:"He works very ___.",opts:["hardly","hard","hardy"],a:"hard",ex:"Hard = dur (hardly = à peine)."},
 {q:"Find the mistake:",opts:["He runs fast.","He runs fastly.","He runs quickly."],a:"He runs fastly.",ex:"Fast est invariable."}
]},
{id:"connectors",lvl:"A2",title:"Les connecteurs",tag:"Connecteurs",
 explain:"And (et), but (mais), because (parce que), so (donc), or (ou), although (bien que), however (cependant), then (ensuite), also (aussi), for example (par exemple).",
 examples:[["I'm tired, so I'm going to bed.","Je suis fatiguée, donc je vais me coucher."],["I stayed home because it was raining.","Je suis restée à la maison parce qu'il pleuvait."],["Although it was cold, we went out.","Bien qu'il fît froid, nous sommes sortis."]],
 tip:"Because donne la cause. So donne la conséquence. Ne les confondez pas !",
 ex:[
 {q:"I was hungry, ___ I ate a sandwich.",opts:["because","so","but"],a:"so",ex:"Conséquence → so."},
 {q:"I ate a sandwich ___ I was hungry.",opts:["so","because","although"],a:"because",ex:"Cause → because."},
 {q:"It was expensive, ___ I bought it.",opts:["so","because","but"],a:"but",ex:"Opposition → but."},
 {q:"___ it was raining, we went out.",opts:["Although","Because","So"],a:"Although",ex:"Concession → although."},
 {q:"Do you want tea ___ coffee?",opts:["and","but","or"],a:"or",ex:"Choix → or."}
]},
{id:"present_perfect_b1",lvl:"B1",title:"Present perfect : for / since / duration",tag:"Present perfect",
 explain:"Action commencée dans le passé et qui continue. I have lived here FOR 5 years (durée). I have lived here SINCE 2019 (point de départ). Present perfect continuous : have been + -ing pour insister sur la durée : I have been learning English for 6 months.",
 examples:[["I have known Umit for ten years.","Je connais Umit depuis dix ans."],["She has worked here since March.","Elle travaille ici depuis mars."],["How long have you been waiting?","Depuis combien de temps attends-tu ?"]],
 tip:"En français on dit « je vis ici depuis 5 ans » (présent) ; en anglais → present perfect : I HAVE LIVED here for 5 years.",
 ex:[
 {q:"I have lived in Izmir ___ 2015.",opts:["for","since","during"],a:"since",ex:"Point de départ → since."},
 {q:"She has worked here ___ three years.",opts:["for","since","ago"],a:"for",ex:"Durée → for."},
 {q:"How long ___ you known him?",opts:["do","have","did"],a:"have",ex:"How long + present perfect."},
 {q:"I ___ English for six months.",opts:["learn","have been learning","am learning"],a:"have been learning",ex:"Durée jusqu'à maintenant → perfect continuous."},
 {q:"Find the mistake:",opts:["I live here since 2010.","I have lived here since 2010.","I have been living here since 2010."],a:"I live here since 2010.",ex:"Depuis + toujours vrai → present perfect."},
 {q:"We ___ each other since school.",opts:["know","have known","knew"],a:"have known",ex:"Since → present perfect."},
 {q:"He ___ his keys. He can't get in.",opts:["lost","has lost","loses"],a:"has lost",ex:"Résultat présent → present perfect."}
]},
{id:"past_continuous",lvl:"B1",title:"Le past continuous",tag:"Past continuous",
 explain:"Was / were + -ing. Action en cours dans le passé, souvent interrompue par une autre (past simple). I was cooking when Umit arrived. Aussi pour planter un décor : It was raining. People were walking.",
 examples:[["I was sleeping when you called.","Je dormais quand tu as appelé."],["They were watching TV at 9.","Ils regardaient la télé à 9 h."],["What were you doing?","Que faisais-tu ?"]],
 tip:"While + past continuous ; when + past simple : « While I was cooking, the phone rang. »",
 ex:[
 {q:"I ___ when the phone rang.",opts:["slept","was sleeping","am sleeping"],a:"was sleeping",ex:"Action en cours, interrompue."},
 {q:"They ___ football at 5 pm yesterday.",opts:["played","were playing","play"],a:"were playing",ex:"Moment précis en cours → were playing."},
 {q:"What ___ you doing at 10 last night?",opts:["was","did","were"],a:"were",ex:"You → were."},
 {q:"While she ___, he was cooking.",opts:["read","was reading","reads"],a:"was reading",ex:"Deux actions parallèles → continuous."},
 {q:"Find the mistake:",opts:["I was walking when I saw him.","I walked when I was seeing him.","I saw him while I was walking."],a:"I walked when I was seeing him.",ex:"L'action longue prend -ing, l'action courte est au past simple."}
]},
{id:"past_perfect",lvl:"B1",title:"Le past perfect",tag:"Past perfect",
 explain:"Had + participe passé. Action qui s'est passée AVANT une autre action passée. When I arrived, the film had already started. (Le film a commencé avant mon arrivée.)",
 examples:[["She had left when I called.","Elle était partie quand j'ai appelé."],["I had never seen the sea before that day.","Je n'avais jamais vu la mer avant ce jour."]],
 tip:"Past perfect = le « passé du passé ». Souvent avec already, before, after, by the time.",
 ex:[
 {q:"When we arrived, the train ___ already left.",opts:["has","had","was"],a:"had",ex:"Avant l'arrivée → had left."},
 {q:"I ___ never eaten sushi before I went to Japan.",opts:["have","had","was"],a:"had",ex:"Avant un moment passé → had."},
 {q:"She was tired because she ___ all night.",opts:["worked","had worked","has worked"],a:"had worked",ex:"Cause antérieure → past perfect."},
 {q:"By the time he came, we ___ dinner.",opts:["finished","had finished","have finished"],a:"had finished",ex:"By the time → past perfect."},
 {q:"Find the mistake:",opts:["After I had eaten, I left.","After I have eaten, I left.","I left after I had eaten."],a:"After I have eaten, I left.",ex:"Contexte passé → had eaten."}
]},
{id:"conditionals",lvl:"B1",title:"Les conditionnels (0, 1, 2)",tag:"Conditionnels",
 explain:"Zero : If + présent, présent (vérité générale : If you heat water, it boils). First : If + présent, WILL (réel/futur : If it rains, I will stay home). Second : If + past simple, WOULD (imaginaire : If I had money, I would travel). Note : If I WERE you...",
 examples:[["If it rains, we will stay at home.","S'il pleut, nous resterons à la maison."],["If I were rich, I would buy a house.","Si j'étais riche, j'achèterais une maison."],["If I were you, I would accept.","À ta place, j'accepterais."]],
 tip:"Jamais WILL après IF : « If it will rain » est faux → If it rains.",
 ex:[
 {q:"If it ___ tomorrow, we will stay home.",opts:["rains","will rain","rained"],a:"rains",ex:"1er conditionnel : if + présent."},
 {q:"If I ___ rich, I would travel the world.",opts:["am","were","will be"],a:"were",ex:"2e conditionnel : if + past."},
 {q:"If you heat ice, it ___.",opts:["melts","will melt","would melt"],a:"melts",ex:"Vérité générale → conditionnel zéro."},
 {q:"If I had time, I ___ help you.",opts:["will","would","can"],a:"would",ex:"Imaginaire → would."},
 {q:"Find the mistake:",opts:["If it will rain, I'll stay.","If it rains, I'll stay.","If it rained, I'd stay."],a:"If it will rain, I'll stay.",ex:"Pas de will après if."},
 {q:"If I ___ you, I would call her.",opts:["am","was","were"],a:"were",ex:"If I were you = expression figée."},
 {q:"She ___ pass the exam if she studies.",opts:["will","would","passes"],a:"will",ex:"Condition réelle → will."}
]},
{id:"passive",lvl:"B1",title:"La voix passive",tag:"Passif",
 explain:"Be + participe passé. On met l'accent sur l'action, pas sur qui la fait. Actif : They make cars in Japan. Passif : Cars are made in Japan. Passé : The house was built in 1990. By + agent si nécessaire.",
 examples:[["English is spoken here.","On parle anglais ici."],["The window was broken.","La fenêtre a été cassée."],["The book was written by Orwell.","Le livre a été écrit par Orwell."]],
 tip:"Le « on » français se traduit souvent par un passif : « On m'a volé mon sac » = My bag was stolen.",
 ex:[
 {q:"This bread ___ every morning.",opts:["is made","makes","is making"],a:"is made",ex:"Présent passif → is made."},
 {q:"The car ___ by a mechanic yesterday.",opts:["repaired","was repaired","has repaired"],a:"was repaired",ex:"Passé passif → was repaired."},
 {q:"English ___ all over the world.",opts:["speaks","is spoken","is speaking"],a:"is spoken",ex:"On parle anglais → passif."},
 {q:"My bag ___ on the train.",opts:["stole","was stolen","has stole"],a:"was stolen",ex:"On m'a volé mon sac → passif."},
 {q:"Find the mistake:",opts:["The letter was sent yesterday.","The letter sent yesterday.","They sent the letter yesterday."],a:"The letter sent yesterday.",ex:"Il manque « was »."},
 {q:"The new bridge ___ next year.",opts:["will build","will be built","builds"],a:"will be built",ex:"Futur passif → will be + PP."}
]},
{id:"reported",lvl:"B1",title:"Le discours indirect",tag:"Reported speech",
 explain:"Rapporter des paroles : le temps recule d'un cran. « I am tired » → She said (that) she WAS tired. « I will come » → He said he WOULD come. « I have finished » → She said she HAD finished. Say (something) / tell (someone).",
 examples:[["\"I love you.\" → He said he loved me.","Il a dit qu'il m'aimait."],["\"I can help.\" → She said she could help.","Elle a dit qu'elle pouvait aider."]],
 tip:"Say + phrase / tell + personne : He SAID he was late. He TOLD ME he was late.",
 ex:[
 {q:"\"I am happy.\" → She said she ___ happy.",opts:["is","was","were"],a:"was",ex:"Present → past."},
 {q:"\"I will call you.\" → He said he ___ call me.",opts:["will","would","can"],a:"would",ex:"Will → would."},
 {q:"\"I can swim.\" → She said she ___ swim.",opts:["can","could","will"],a:"could",ex:"Can → could."},
 {q:"He ___ me he was tired.",opts:["said","told","say"],a:"told",ex:"Tell + personne."},
 {q:"Find the mistake:",opts:["She said me she was ill.","She told me she was ill.","She said she was ill."],a:"She said me she was ill.",ex:"Say ne prend pas de complément de personne."},
 {q:"\"I have finished.\" → She said she ___ finished.",opts:["has","had","have"],a:"had",ex:"Present perfect → past perfect."}
]},
{id:"relatives",lvl:"B1",title:"Les propositions relatives",tag:"Relatives",
 explain:"Who (personnes), which (choses), that (les deux), where (lieu), whose (dont, possession), when (moment). The man WHO lives here is a doctor. The book WHICH I read was great. Le pronom complément peut être omis : The book (that) I read.",
 examples:[["The woman who called is my boss.","La femme qui a appelé est ma patronne."],["This is the house where I was born.","Voici la maison où je suis née."],["The man whose car was stolen is angry.","L'homme dont la voiture a été volée est en colère."]],
 tip:"Who pour les personnes, which pour les choses, that pour les deux (style informel).",
 ex:[
 {q:"The man ___ lives next door is a teacher.",opts:["who","which","where"],a:"who",ex:"Personne → who."},
 {q:"The phone ___ I bought is broken.",opts:["who","which","where"],a:"which",ex:"Chose → which."},
 {q:"This is the restaurant ___ we met.",opts:["which","where","who"],a:"where",ex:"Lieu → where."},
 {q:"The girl ___ bag was stolen is crying.",opts:["who","whose","which"],a:"whose",ex:"Possession → whose."},
 {q:"Find the mistake:",opts:["The book which I read was good.","The man which called is here.","The man who called is here."],a:"The man which called is here.",ex:"Personne → who."}
]},
{id:"gerund_inf",lvl:"B1",title:"Gerund ou infinitif ?",tag:"Gerund / Infinitive",
 explain:"Verbe + -ING après : enjoy, finish, mind, avoid, suggest, keep, et après les prépositions (interested IN learning). Verbe + TO après : want, need, decide, hope, plan, would like, learn. Like / love / hate acceptent les deux.",
 examples:[["I enjoy reading.","J'aime lire."],["I want to travel.","Je veux voyager."],["She decided to stay.","Elle a décidé de rester."],["I'm good at cooking.","Je suis douée en cuisine."]],
 tip:"Après une préposition (at, in, of, about, for), TOUJOURS -ing : thank you FOR helping.",
 ex:[
 {q:"I enjoy ___ music.",opts:["listen to","listening to","to listen to"],a:"listening to",ex:"Enjoy + -ing."},
 {q:"She wants ___ a new car.",opts:["buying","to buy","buy"],a:"to buy",ex:"Want + to."},
 {q:"Thank you for ___ me.",opts:["help","to help","helping"],a:"helping",ex:"Préposition → -ing."},
 {q:"We decided ___ at home.",opts:["staying","to stay","stay"],a:"to stay",ex:"Decide + to."},
 {q:"Would you mind ___ the window?",opts:["opening","to open","open"],a:"opening",ex:"Mind + -ing."},
 {q:"Find the mistake:",opts:["I finished to work.","I finished working.","I hope to work."],a:"I finished to work.",ex:"Finish + -ing."}
]},
{id:"phrasal_b1",lvl:"B1",title:"Les phrasal verbs",tag:"Phrasal verbs",
 explain:"Verbe + particule (up, on, off, out, after...) qui change le sens. Look for = chercher. Look after = s'occuper de. Give up = abandonner. Turn on / off = allumer / éteindre. Pick up = aller chercher. Find out = découvrir.",
 examples:[["I'm looking for my keys.","Je cherche mes clés."],["Never give up!","N'abandonne jamais !"],["Can you pick me up at 8?","Peux-tu venir me chercher à 8 h ?"]],
 tip:"Apprenez les phrasal verbs dans des phrases, jamais isolément. Le sens vient du contexte.",
 ex:[
 {q:"I'm looking ___ my glasses. Have you seen them?",opts:["after","for","up"],a:"for",ex:"Chercher → look for."},
 {q:"Can you ___ the light? It's dark.",opts:["turn on","turn off","turn up"],a:"turn on",ex:"Allumer → turn on."},
 {q:"Don't ___! You're almost there.",opts:["give up","give in","get up"],a:"give up",ex:"Abandonner → give up."},
 {q:"She ___ her little brother when her parents work.",opts:["looks for","looks after","looks at"],a:"looks after",ex:"S'occuper de → look after."},
 {q:"I need to ___ what time the train leaves.",opts:["find out","find up","look out"],a:"find out",ex:"Découvrir → find out."},
 {q:"We ___ milk. Can you buy some?",opts:["ran out of","ran into","ran over"],a:"ran out of",ex:"Ne plus avoir → run out of."}
]},
{id:"third_cond",lvl:"B2",title:"Le troisième conditionnel",tag:"Third conditional",
 explain:"If + past perfect, WOULD HAVE + participe passé. Pour parler d'un passé imaginaire (regret, reproche). If I had studied, I would have passed. (Mais je n'ai pas étudié.)",
 examples:[["If I had known, I would have come.","Si j'avais su, je serais venue."],["She wouldn't have missed the train if she had left earlier.","Elle n'aurait pas raté le train si elle était partie plus tôt."]],
 tip:"Forme contractée fréquente à l'oral : I'd have come / I would've come.",
 ex:[
 {q:"If I ___ known, I would have called you.",opts:["have","had","would have"],a:"had",ex:"If + past perfect."},
 {q:"If she had studied, she ___ passed.",opts:["would","would have","will have"],a:"would have",ex:"Would have + PP."},
 {q:"We ___ the flight if we had left earlier.",opts:["wouldn't miss","wouldn't have missed","didn't miss"],a:"wouldn't have missed",ex:"Passé imaginaire → would have + PP."},
 {q:"Find the mistake:",opts:["If I had seen him, I would have said hello.","If I would have seen him, I'd have said hello.","Had I seen him, I would have said hello."],a:"If I would have seen him, I'd have said hello.",ex:"Pas de would dans la partie if."},
 {q:"If you ___ me, I would have helped.",opts:["asked","had asked","have asked"],a:"had asked",ex:"If + had + PP."}
]},
{id:"mixed_cond",lvl:"B2",title:"Les conditionnels mixtes",tag:"Mixed conditionals",
 explain:"Mélange passé et présent. Condition passée, résultat présent : If I had studied medicine, I would be a doctor now. Condition présente, résultat passé : If I were more organised, I wouldn't have forgotten.",
 examples:[["If I had taken that job, I would be rich now.","Si j'avais pris ce poste, je serais riche maintenant."],["If she weren't so shy, she would have spoken.","Si elle n'était pas si timide, elle aurait parlé."]],
 tip:"Repérez les marqueurs de temps : « now » dans le résultat = conditionnel mixte.",
 ex:[
 {q:"If I had slept more, I ___ so tired now.",opts:["wouldn't be","wouldn't have been","won't be"],a:"wouldn't be",ex:"Résultat présent → would + base."},
 {q:"If he ___ more careful, he wouldn't have crashed.",opts:["were","had been","is"],a:"were",ex:"Trait de caractère présent → were."},
 {q:"If we had bought the house, we ___ in the city today.",opts:["would live","would have lived","lived"],a:"would live",ex:"Today → présent."},
 {q:"If I ___ you, I would have said yes.",opts:["were","had been","am"],a:"were",ex:"If I were you = constante."}
]},
{id:"adv_modals",lvl:"B2",title:"Les modaux du passé",tag:"Modaux avancés",
 explain:"Modal + have + participe passé. Should have = aurait dû (reproche). Could have = aurait pu. Must have = a dû (déduction forte). Might have = a peut-être. Can't have = ne peut pas avoir (impossible).",
 examples:[["You should have called me.","Tu aurais dû m'appeler."],["She must have forgotten.","Elle a dû oublier."],["He can't have finished already!","Il ne peut pas avoir déjà fini !"]],
 tip:"Should've, could've, must've à l'oral. Doit faire penser au regret ou à la déduction.",
 ex:[
 {q:"You ___ told me! I would have helped.",opts:["should have","must have","can have"],a:"should have",ex:"Reproche → should have."},
 {q:"The lights are off. They ___ gone out.",opts:["can't have","must have","should have"],a:"must have",ex:"Déduction logique → must have."},
 {q:"She ___ passed, she didn't study at all!",opts:["can't have","must have","should have"],a:"can't have",ex:"Impossible → can't have."},
 {q:"I ___ taken the earlier train, but I overslept.",opts:["could have","must have","can't have"],a:"could have",ex:"Possibilité non réalisée → could have."},
 {q:"Find the mistake:",opts:["You should have come.","You should came.","You could have come."],a:"You should came.",ex:"Modal + have + PP."}
]},
{id:"adv_passive",lvl:"B2",title:"Le passif avancé",tag:"Passif avancé",
 explain:"Passif avec modaux : It must be done. Passif avec present perfect : The work has been finished. Causatif : have / get something done (faire faire) : I had my car repaired. Structure impersonnelle : It is said that... / He is said to be...",
 examples:[["The report must be sent today.","Le rapport doit être envoyé aujourd'hui."],["I had my hair cut.","Je me suis fait couper les cheveux."],["She is said to be very rich.","On dit qu'elle est très riche."]],
 tip:"« Je me suis fait couper les cheveux » ≠ I cut my hair (je l'ai fait moi-même) → I HAD my hair CUT.",
 ex:[
 {q:"The documents ___ by Friday.",opts:["must send","must be sent","must sent"],a:"must be sent",ex:"Modal passif → must be + PP."},
 {q:"I ___ my car repaired yesterday.",opts:["had","made","did"],a:"had",ex:"Causatif → have + objet + PP."},
 {q:"The project ___ completed yet.",opts:["hasn't been","hasn't","wasn't being"],a:"hasn't been",ex:"Present perfect passif."},
 {q:"He ___ to be the best player in the team.",opts:["is said","says","is saying"],a:"is said",ex:"Structure impersonnelle → is said to."},
 {q:"Find the mistake:",opts:["I had my hair cut.","I cut my hair at the hairdresser's.","I got my hair cut."],a:"I cut my hair at the hairdresser's.",ex:"Faire faire → have / get + PP."}
]},
{id:"adv_reported",lvl:"B2",title:"Discours indirect avancé",tag:"Reported speech avancé",
 explain:"Questions rapportées : « Where do you live? » → She asked me where I lived (ordre affirmatif, pas d'auxiliaire). Yes/no : « Are you OK? » → He asked if / whether I was OK. Ordres : « Sit down! » → He told me to sit down. Verbes introducteurs : suggest, advise, warn, promise, admit, deny.",
 examples:[["She asked me where I worked.","Elle m'a demandé où je travaillais."],["He advised me to rest.","Il m'a conseillé de me reposer."],["They denied taking the money.","Ils ont nié avoir pris l'argent."]],
 tip:"Dans une question rapportée, l'ordre redevient sujet + verbe : where I LIVED (pas « where did I live »).",
 ex:[
 {q:"\"Where do you live?\" → She asked me where ___.",opts:["did I live","I lived","do I live"],a:"I lived",ex:"Ordre affirmatif + recul de temps."},
 {q:"\"Are you tired?\" → He asked ___ I was tired.",opts:["that","if","what"],a:"if",ex:"Question fermée → if / whether."},
 {q:"\"Don't touch it!\" → She told me ___ it.",opts:["don't touch","not to touch","to not touching"],a:"not to touch",ex:"Ordre négatif → not to + base."},
 {q:"He ___ me to see a doctor.",opts:["advised","suggested","said"],a:"advised",ex:"Advise + personne + to."},
 {q:"She ___ going to the cinema.",opts:["suggested","advised","told"],a:"suggested",ex:"Suggest + -ing."}
]},
{id:"inversion",lvl:"B2",title:"L'inversion",tag:"Inversion",
 explain:"Pour insister, style formel : après never, rarely, seldom, not only, no sooner, under no circumstances, l'ordre devient auxiliaire + sujet. Never have I seen such beauty. Not only did she sing, but she also danced. Had I known, I would have come (= If I had known).",
 examples:[["Never have I been so happy.","Jamais je n'ai été aussi heureuse."],["Not only is he smart, but he is also kind.","Non seulement il est intelligent, mais il est aussi gentil."],["Had I known, I would have called.","Si j'avais su, j'aurais appelé."]],
 tip:"L'inversion est surtout écrite ou formelle. À l'oral, on l'utilise pour un effet dramatique.",
 ex:[
 {q:"Never ___ such a beautiful place.",opts:["I have seen","have I seen","I saw"],a:"have I seen",ex:"Never + auxiliaire + sujet."},
 {q:"Not only ___ late, but he also forgot the documents.",opts:["he was","was he","he is"],a:"was he",ex:"Not only + inversion."},
 {q:"___ I known about the party, I would have come.",opts:["Had","If","Have"],a:"Had",ex:"Had I known = If I had known."},
 {q:"Rarely ___ such a good film.",opts:["do we see","we see","we do see"],a:"do we see",ex:"Rarely + do + sujet."},
 {q:"Under no circumstances ___ leave the room.",opts:["you should","should you","you must"],a:"should you",ex:"Inversion après under no circumstances."}
]},
{id:"tense_nuances",lvl:"B2",title:"Nuances entre les temps",tag:"Nuances des temps",
 explain:"Present perfect simple (résultat) vs continuous (durée, activité) : I've written 3 emails / I've been writing emails all morning. Used to (habitude passée révolue) vs be used to + -ing (être habitué). Future continuous (will be doing) et future perfect (will have done).",
 examples:[["I used to smoke, but I stopped.","Avant je fumais, mais j'ai arrêté."],["I am used to getting up early.","J'ai l'habitude de me lever tôt."],["By 2030, I will have finished my studies.","D'ici 2030, j'aurai fini mes études."],["This time tomorrow, I'll be flying to London.","Demain à cette heure-ci, je serai dans l'avion pour Londres."]],
 tip:"Used to + base = « avant, je ». Be used to + -ing = « je suis habitué à ». Ne pas confondre !",
 ex:[
 {q:"I ___ live in Ankara, but now I live in Izmir.",opts:["used to","am used to","use to"],a:"used to",ex:"Habitude révolue → used to."},
 {q:"She ___ working at night. It's normal for her.",opts:["used to","is used to","uses to"],a:"is used to",ex:"Habitude actuelle → be used to + -ing."},
 {q:"By next year, I ___ my degree.",opts:["will finish","will have finished","will be finishing"],a:"will have finished",ex:"By + moment futur → future perfect."},
 {q:"I've ___ all morning. I'm exhausted!",opts:["cleaned","been cleaning","clean"],a:"been cleaning",ex:"Insiste sur la durée → continuous."},
 {q:"Find the mistake:",opts:["I'm used to drive on the left.","I'm used to driving on the left.","I used to drive a lot."],a:"I'm used to drive on the left.",ex:"Be used to + -ing."}
]},
{id:"idioms",lvl:"B2",title:"Expressions idiomatiques",tag:"Idiomes",
 explain:"Des expressions dont le sens n'est pas littéral. It's raining cats and dogs (il pleut des cordes). Break a leg (bonne chance). Piece of cake (facile). Hit the sack (aller se coucher). Cost an arm and a leg (coûter les yeux de la tête). Once in a blue moon (très rarement).",
 examples:[["The test was a piece of cake.","Le test était du gâteau."],["That car cost an arm and a leg.","Cette voiture a coûté les yeux de la tête."],["I'm feeling under the weather.","Je ne suis pas dans mon assiette."]],
 tip:"N'inventez pas de traductions littérales ! Apprenez les idiomes par le contexte.",
 ex:[
 {q:"The exam was ___. I finished in 10 minutes.",opts:["a piece of cake","a hot potato","a cup of tea"],a:"a piece of cake",ex:"Très facile."},
 {q:"I'm tired. I'm going to ___.",opts:["hit the sack","hit the road","break a leg"],a:"hit the sack",ex:"Aller se coucher."},
 {q:"You have an interview? ___!",opts:["Break a leg","Hit the sack","Pull my leg"],a:"Break a leg",ex:"Bonne chance."},
 {q:"That bag ___. It was 2000 euros!",opts:["cost an arm and a leg","broke the ice","rang a bell"],a:"cost an arm and a leg",ex:"Très cher."},
 {q:"I only see him ___.",opts:["once in a blue moon","under the weather","on cloud nine"],a:"once in a blue moon",ex:"Très rarement."},
 {q:"She told a joke to ___.",opts:["break the ice","break a leg","hit the sack"],a:"break the ice",ex:"Détendre l'atmosphère."}
]},
{id:"complex",lvl:"B2",title:"Structures complexes",tag:"Structures complexes",
 explain:"Wish / if only + past (regret présent) : I wish I had more time. Wish + past perfect (regret passé) : I wish I had studied. Would rather + base : I'd rather stay. It's time + past : It's time we left. Cleft sentences : What I need is a holiday. / It was Umit who cooked.",
 examples:[["I wish I spoke English fluently.","J'aimerais parler anglais couramment."],["I'd rather not go out tonight.","Je préférerais ne pas sortir ce soir."],["What I love is travelling.","Ce que j'adore, c'est voyager."]],
 tip:"Wish + past simple = regret sur le présent. Wish + past perfect = regret sur le passé.",
 ex:[
 {q:"I wish I ___ more free time.",opts:["have","had","would have"],a:"had",ex:"Regret présent → wish + past."},
 {q:"I wish I ___ harder at school.",opts:["studied","had studied","study"],a:"had studied",ex:"Regret passé → past perfect."},
 {q:"I'd rather ___ at home tonight.",opts:["stay","to stay","staying"],a:"stay",ex:"Would rather + base."},
 {q:"It's time we ___.",opts:["go","went","will go"],a:"went",ex:"It's time + past."},
 {q:"___ I really need is a holiday.",opts:["That","What","Which"],a:"What",ex:"Cleft sentence : What + ... + is."},
 {q:"It was Umit ___ cooked dinner, not me.",opts:["who","which","whom"],a:"who",ex:"Cleft : It was X who..."}
]}
];

/* ---------- Progression / stats ---------- */
function today(){const d=todayStr();if(!S.stats.days[d])S.stats.days[d]={ex:0,ok:0,ko:0,sec:0,xp:0};return S.stats.days[d];}

function skillScore(s){const h=S.skills[s].hist;if(h.length<3)return null;const w=h.slice(-30);return Math.round(100*w.filter(Boolean).length/w.length);}
function skillScoreOr(s,d=60){const v=skillScore(s);return v==null?d:v;}
function skillLevelIdx(s){const sk=S.skills[s];const base=LVI(S.level);let auto=0;const sc=skillScore(s);const n=sk.hist.length;if(sc!=null&&sc>=85&&n>=10)auto=1;if(sc!=null&&sc<45&&n>=6)auto=-1;if(sk.cw>=3)auto=Math.min(auto,-1);return clamp(base+sk.adj+auto,0,3);}
function skillLevelLabel(s){const i=skillLevelIdx(s);const sc=skillScore(s);let suf='';if(sc!=null){if(sc>=85)suf='+';else if(sc<55)suf='-';}return LV[i]+suf;}
function globalScore(){const v=Object.keys(SKILLS).map(skillScore).filter(x=>x!=null);if(!v.length)return null;return Math.round(v.reduce((a,b)=>a+b,0)/v.length);}
function overallProgress(){// % sur le parcours A1→B2
 const li=LVI(S.level);const g=globalScore()||0;const learned=Object.values(S.items).filter(i=>i.m>=4).length;const total=VOCAB.length+PHRASES.length+VERBS.length+EXPRESSIONS.length;
 return clamp(Math.round(li*25+Math.min(25,g/4)*0.5+Math.min(25,learned/total*100)*0.5),0,100);}
function wordsLearned(){return VOCAB.filter(v=>(S.items[v.key]||{}).learned||(S.items[v.key]||{}).m>=4).length;}
function phrasesMastered(){return PHRASES.filter(p=>(S.items[p.key]||{}).known||(S.items[p.key]||{}).m>=4).length;}

function getItem(k){if(!S.items[k])S.items[k]={m:0,ok:0,ko:0,last:0,next:0,lastKo:0};return S.items[k];}

let RUN={streak:0};
/** Enregistre une réponse. Retourne {redeemed} */
function record({key,skill,topic,ok,lvl}){
 touchStreak();const now=Date.now();const it=key?getItem(key):null;let redeemed=false;
 if(it){const wasWeak=it.lastKo>0&&it.m<=3;if(it.m===0)addXP(XP.newItem);
  if(ok){if(wasWeak&&it.ko>0)redeemed=true;it.m=clamp(it.m+1,1,5);it.ok++;it.next=now+SRS_INTERVALS[it.m];if(it.m>=4&&wasWeak)redeemed=true;}
  else{it.m=it.m<=1?2:Math.max(2,it.m-1);if(it.m===2&&it.ok===0&&it.ko===0)it.m=2;it.ko++;it.lastKo=now;it.next=now+5*60e3;}
  it.last=now;if(it.m>0&&(it.ok+it.ko)>1)S.stats.reviews++;}
 if(skill&&S.skills[skill]){const sk=S.skills[skill];sk.hist.push(!!ok);if(sk.hist.length>60)sk.hist.shift();if(ok){sk.cc++;sk.cw=0;if(sk.cc>=10&&sk.adj<1){sk.adj=Math.min(1,sk.adj+1);sk.cc=0;toast(t('Excellent ! On augmente légèrement la difficulté 📈','Excellent! Slightly raising the difficulty 📈'),'gold');}}else{sk.cw++;sk.cc=0;if(sk.cw===3){toast(t('On simplifie un peu et on réexplique 🧠','Let\'s simplify a bit and re-explain 🧠'),'ko',3000);}}}
 if(topic){const tr=topicRec(topic);tr.skill=skill;if(ok)tr.ok++;else{tr.ko++;tr.lastKo=now;}tr.last=now;}
 S.stats.exercises++;const d=today();d.ex++;if(ok){S.stats.correct++;d.ok++;addXP(XP.correct);RUN.streak++;}else{S.stats.wrong++;d.ko++;RUN.streak=0;}
 if(skill==='listening')S.stats.listening++;
 if(ok)praise(RUN.streak,redeemed);else encourage();
 checkLevelUp();checkBadges();save();return {redeemed};
}
function checkLevelUp(){
 const li=LVI(S.level);if(li>=3)return;const sc=s=>skillScoreOr(s,0);const quiz=avgScore();
 let ok=false;
 if(li===0){const T=LEVEL_THRESHOLDS['A1>A2'];ok=sc('vocab')>=T.vocab&&sc('grammar')>=T.grammar&&quiz>=T.quiz&&sc('listening')>=T.listening&&S.stats.exercises>=60;}
 else if(li===1){const T=LEVEL_THRESHOLDS['A2>B1'];ok=sc('vocab')>=T.vocab&&sc('grammar')>=T.grammar&&sc('listening')>=T.listening&&sc('phrases')>=T.phrases&&S.stats.exercises>=200;}
 else{const T=LEVEL_THRESHOLDS['B1>B2'];ok=(globalScore()||0)>=T.global&&sc('listening')>=T.listening&&sc('grammar')>=T.grammar&&sc('vocab')>=T.vocab&&S.stats.exercises>=400;}
 if(ok){S.level=LV[li+1];Object.values(S.skills).forEach(s=>{s.adj=0;s.cc=0;s.cw=0;});addXP(XP.level);confetti();setTimeout(()=>toast(`🚀 NOUVEAU NIVEAU : ${S.level} !\n+500 XP — Umit est carrément impressionné ❤️🧠`,'gold',4500),400);}
}

function missionTargets(){const f=clamp(S.prefs.dailyMinutes/15,0.4,3);const r=n=>Math.max(1,Math.round(n*f));const pr=S.profile.priority;const boost=k=>pr===k?1.5:1;
 return {words:r(10*boost('Vocabulaire')),reviews:r(5),phrases:r(5),grammar:r(10*boost('Grammaire')),listening:r(5*boost('Listening')*(S.prefs.immersion?1.5:1)),translation:r(3*boost('Traduction')),convo:r(1*boost('Conversation'))};}
const MISSION_LABELS={words:['nouveaux mots','new words'],reviews:['révisions','reviews'],phrases:['phrases','sentences'],grammar:['exercices de grammaire','grammar exercises'],listening:['exercices de listening','listening exercises'],translation:['traductions','translations'],convo:['mini-conversation','mini-conversation']};
function daily(){const d=todayStr();if(S.daily.date!==d){S.daily={date:d,done:{words:0,reviews:0,phrases:0,grammar:0,listening:0,translation:0,convo:0},completed:false};save();}return S.daily;}
function mission(k,n=1){const d=daily();d.done[k]=(d.done[k]||0)+n;const tg=missionTargets();const pct=missionPct();if(!d.completed&&pct>=100){d.completed=true;addXP(XP.session);S.stats.sessions++;confetti();setTimeout(()=>toast('🎯 MISSION DU JOUR TERMINÉE !\n+50 XP — Umit est très fier de toi ❤️🧠','gold',4000),300);}save();}
function missionPct(){const d=daily(),tg=missionTargets();let tot=0,done=0;for(const k in tg){tot+=tg[k];done+=Math.min(tg[k],d.done[k]||0);}return tot?Math.round(100*done/tot):0;}

function coachAdvice(){
 const scores=Object.keys(SKILLS).map(s=>({s,v:skillScore(s),n:S.skills[s].hist.length}));const known=scores.filter(x=>x.v!=null);
 if(S.stats.exercises<5)return t(`Bienvenue Sevde ! Commence par « Continuer mon apprentissage » : je vais observer tes réponses pour construire un parcours sur mesure. Ta priorité : ${S.profile.priority}.`,`Welcome Sevde! Start with "Continue learning": I'll watch your answers to build a personalised path. Your priority: ${S.profile.priority}.`);

 const td=today();const weekOk=Object.entries(S.stats.days).filter(([d])=>d>=daysAgo(6)).reduce((a,[,v])=>[a[0]+v.ok,a[1]+v.ex],[0,0]);const weekPct=weekOk[1]?Math.round(100*weekOk[0]/weekOk[1]):0;
 const lines=[];

 if(topics.length){const [name,r]=topics[0];lines.push(t(`Tu fais encore plusieurs erreurs avec « ${name} » (${r.ko} erreurs). Je vais te proposer davantage d'exercices dessus.`,`You still make several mistakes with "${name}" (${r.ko} errors). I'll give you more exercises on it.`));}
 else if(weak&&weak.v<65)lines.push(t(`${SKILLS[weak.s]} est actuellement ton principal point faible (${weak.v} %). Aujourd'hui, travaille davantage cette compétence.`,`${SKILLS[weak.s]} is currently your main weak point (${weak.v}%). Focus on it today.`));
 if(weekPct>=80&&weekOk[1]>=20)lines.push(t(`Excellent progrès cette semaine (${weekPct} % de réussite) ! Nous allons augmenter légèrement la difficulté.`,`Excellent progress this week (${weekPct}% success)! We'll raise the difficulty slightly.`));
 else if(weekOk[1]>=10&&weekPct<55)lines.push(t(`Cette semaine est un peu difficile (${weekPct} %). On revient sur les bases avec des exemples simples, sans pression ❤️`,`This week is a bit tough (${weekPct}%). Let's go back to basics with simple examples, no pressure ❤️`));
 if(!lines.length)lines.push(t(`Ton parcours est équilibré. Continue régulièrement : petit à petit, ton anglais devient automatique.`,`Your path is balanced. Keep going regularly: little by little, your English becomes automatic.`));
 return lines.join(' ');

function weakTopics(){return Object.entries(S.topics).map(([name,r])=>({name,...r,score:Math.round(100*r.ok/((r.ok+r.ko)||1))})).filter(x=>x.ko>=1&&(x.score<70||x.ko>=3)).sort((a,b)=>(b.ko-a.ko)||(a.score-b.score));}

/* ---------- Sélection adaptative ---------- */
function priority(key){const it=S.items[key];const now=Date.now();if(!it||it.m===0)return 4;if(it.m<=2&&it.ko>=2)return 10;if(it.lastKo&&now-it.lastKo<2*86400e3)return 8;if(it.next<=now)return 6;return it.m>=5?0.6:1.5;}
function weightedPick(cands,weightFn,exclude=new Set()){const list=cands.filter(c=>!exclude.has(c.key));if(!list.length)return null;let tot=0;const ws=list.map(c=>{const w=Math.max(.05,weightFn(c));tot+=w;return w;});let r=Math.random()*tot;for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i];}return list[list.length-1];}
function lvlWeight(itemLvl,L){const d=LVI(itemLvl)-L;if(d===0)return 3;if(d===-1)return 1.2;if(d<-1)return .5;if(d===1)return .35;return .05;}
function selectItem(pool,skill,exclude,L=skillLevelIdx(skill)){return weightedPick(pool,c=>priority(c.key)*lvlWeight(c.lvl||'A1',L),exclude);}

/* =========================================================
   Générateurs d'exercices

   ========================================================= */
function distractors(pool,correct,n,field){const set=new Set([norm(correct)]);const out=[];for(const c of shuffle(pool)){const v=c[field];if(!set.has(norm(v))){set.add(norm(v));out.push(v);}if(out.length>=n)break;}return out;}
const lvlRate=(lvl)=>({A1:0.8,A2:0.9,B1:1,B2:1.05}[lvl]||1)*S.prefs.rate;

/* --- Vocabulaire --- */
function genVocab(exclude,mode){const L=skillLevelIdx('vocab');const w=selectItem(VOCAB,'vocab',exclude,L);if(!w)return null;const dir=mode||pick(L>=2?['en>fr','fr>en','fr>en','fill']:['en>fr','en>fr','fr>en']);
 if(dir==='fill'&&w.ex&&w.ex.toLowerCase().includes(w.en.toLowerCase().replace(/^to /,''))){const stem=w.en.replace(/^to /,'');const blank=w.ex.replace(new RegExp(stem,'i'),'_____');return {type:'mcq',key:w.key,skill:'vocab',topic:'Vocabulaire : '+w.cat,prompt:blank,sub:t(`Complète avec le bon mot (${w.fr})`,`Fill in the right word (${w.fr})`),opts:shuffle([stem,...distractors(VOCAB.filter(v=>v.cat===w.cat||Math.random()<.3),stem,3,'en').map(x=>x.replace(/^to /,''))]),answer:stem,explain:`${w.en} = ${w.fr}. ${w.ex}`,audio:w.ex,mission:'words'};}
 if(dir==='fr>en')return {type:'mcq',key:w.key,skill:'vocab',topic:'Vocabulaire : '+w.cat,prompt:w.fr,sub:t('Comment dit-on en anglais ?','How do you say it in English?'),opts:shuffle([w.en,...distractors(VOCAB.filter(v=>v.cat===w.cat).concat(shuffle(VOCAB).slice(0,20)),w.en,3,'en')]),answer:w.en,explain:`${w.en} = ${w.fr}. ${t('Exemple','Example')} : ${w.ex}`,audio:w.en,mission:'words'};
 return {type:'mcq',key:w.key,skill:'vocab',topic:'Vocabulaire : '+w.cat,prompt:w.en,sub:t('Que signifie ce mot ?','What does this word mean?'),opts:shuffle([w.fr,...distractors(VOCAB.filter(v=>v.cat===w.cat).concat(shuffle(VOCAB).slice(0,20)),w.fr,3,'fr')]),answer:w.fr,explain:`${w.en} = ${w.fr}. ${t('Exemple','Example')} : ${w.ex}`,audio:w.en,autoplay:true,mission:'words'};}

/* --- Grammaire --- */
function genGrammar(exclude,topicFilter){const L=skillLevelIdx('grammar');let pool=GRAMMAR_EX;if(topicFilter)pool=pool.filter(e=>e.topic===topicFilter||e.gid===topicFilter);const e=weightedPick(pool,c=>{const tr=S.topics[c.topic];const tw=tr&&tr.ko>=2?2.5:1;return priority(c.key)*lvlWeight(c.lvl,L)*tw;},exclude);if(!e)return null;

/* --- Verbes --- */
function genVerb(exclude,onlyIrregular){const L=skillLevelIdx('verbs');const pool=onlyIrregular?VERBS.filter(v=>v.irr):VERBS;const v=weightedPick(pool,c=>priority(c.key)*(c.irr?1.4:1)*(L===0&&!c.irr?1.5:1),exclude);if(!v)return null;
 const forms=[['past',t('Past simple','Past simple')],['pp',t('Past participle','Past participle')]];const [f,label]=pick(forms);const mode=Math.random();

 return {type:'mcq',key:v.key,skill:'verbs',topic:'Verbes : traduction',prompt:v.fr,sub:t('Quel est ce verbe ?','Which verb is it?'),opts:shuffle([v.base,...distractors(VERBS,v.base,3,'base')]),answer:v.base,explain:`${v.base} → ${v.past} → ${v.pp}. ${v.ex}`,audio:v.base,mission:'words'};}

/* --- Phrases --- */
function genPhrase(exclude){const L=skillLevelIdx('phrases');const p=selectItem(PHRASES,'phrases',exclude,L);if(!p)return null;const mode=Math.random();
 if(mode<.4)return {type:'mcq',key:p.key,skill:'phrases',topic:'Phrases : '+p.sit,prompt:p.en,sub:t('Quelle est la traduction ?','What is the translation?'),opts:shuffle([p.fr,...distractors(PHRASES.filter(x=>x.sit===p.sit||x.lvl===p.lvl),p.fr,3,'fr')]),answer:p.fr,explain:`${p.en} = ${p.fr}`,audio:p.en,autoplay:true,mission:'phrases'};
 if(mode<.75)return {type:'build',key:p.key,skill:'phrases',topic:'Phrases : '+p.sit,prompt:p.fr,sub:t('Reconstitue la phrase anglaise','Build the English sentence'),tokens:buildTokens(p.en),answer:p.en,explain:`${p.en} = ${p.fr}`,audio:p.en,mission:'phrases'};
 return {type:'mcq',key:p.key,skill:'phrases',topic:'Phrases : '+p.sit,prompt:p.fr,sub:t('Quelle phrase anglaise correspond ?','Which English sentence matches?'),opts:shuffle([p.en,...distractors(PHRASES.filter(x=>x.sit===p.sit||x.lvl===p.lvl),p.en,3,'en')]),answer:p.en,explain:`${p.en} = ${p.fr}`,audio:p.en,mission:'phrases'};}
function buildTokens(sentence){const toks=sentence.replace(/[.?!,]/g,'').split(/\s+/);const extraPool=['is','are','the','a','to','do','not','have','was','in','at','on','very','will'];const extras=shuffle(extraPool.filter(e=>!toks.map(x=>x.toLowerCase()).includes(e))).slice(0,toks.length>=8?1:2);return shuffle([...toks,...extras]);}

/* --- Expressions --- */
function genExpression(exclude){const L=skillLevelIdx('expressions');const e=selectItem(EXPRESSIONS,'expressions',exclude,L);if(!e)return null;const mode=Math.random();
 if(mode<.5)return {type:'mcq',key:e.key,skill:'expressions',topic:'Expressions',prompt:e.en,sub:t('Que veut dire cette expression ?','What does this expression mean?'),opts:shuffle([e.fr,...distractors(EXPRESSIONS,e.fr,3,'fr')]),answer:e.fr,explain:`${e.en} = ${e.fr}. ${e.ctx}. « ${e.ex} »`,audio:e.en,autoplay:true,mission:'phrases'};
 return {type:'mcq',key:e.key,skill:'expressions',topic:'Expressions',prompt:e.ctx,sub:t(`Quelle expression utiliser ? (${e.fr})`,`Which expression fits? (${e.fr})`),opts:shuffle([e.en,...distractors(EXPRESSIONS,e.en,3,'en')]),answer:e.en,explain:`${e.en} = ${e.fr}. « ${e.ex} »`,audio:e.ex,mission:'phrases'};}

/* --- Listening --- */
function genListening(exclude,forceMode){const L=skillLevelIdx('listening');const l=selectItem(LISTENING,'listening',exclude,L);if(!l)return null;const rate=lvlRate(l.lvl);const mode=forceMode||pick(L===0?['choose','choose','translate','word']:['choose','translate','fill','word','info']);
 const same=LISTENING.filter(x=>x.lvl===l.lvl||Math.abs(LVI(x.lvl)-LVI(l.lvl))===1);
 if(mode==='translate')return {type:'mcq',key:l.key,skill:'listening',topic:'Listening : traduction',prompt:'🎧',sub:t('Écoute et choisis la traduction','Listen and choose the translation'),opts:shuffle([l.fr,...distractors(same,l.fr,3,'fr')]),answer:l.fr,explain:`« ${l.t} » = ${l.fr}`,audio:l.t,autoplay:true,rate,hideAudioText:true,mission:'listening'};
 if(mode==='fill'){const ws=l.t.replace(/[.?!,;]/g,'').split(' ');const cand=ws.filter(w=>w.length>3);const target=pick(cand.length?cand:ws);const blank=l.t.replace(new RegExp('\\b'+target.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b'),'_____');const others=shuffle(LISTENING.flatMap(x=>x.t.replace(/[.?!,;]/g,'').split(' ')).filter(w=>w.length>3&&norm(w)!==norm(target))).slice(0,3);return {type:'mcq',key:l.key,skill:'listening',topic:'Listening : mot manquant',prompt:blank,sub:t('Écoute et complète la phrase','Listen and complete the sentence'),opts:shuffle([target,...others]),answer:target,explain:`« ${l.t} » = ${l.fr}`,audio:l.t,autoplay:true,rate,mission:'listening'};}
 if(mode==='word'){const ws=l.t.replace(/[.?!,;]/g,'').split(' ').filter(w=>w.length>2);const target=pick(ws);const others=shuffle(LISTENING.flatMap(x=>x.t.replace(/[.?!,;]/g,'').split(' ')).filter(w=>w.length>2&&!ws.map(norm).includes(norm(w)))).slice(0,3);return {type:'mcq',key:l.key,skill:'listening',topic:'Listening : identifier un mot',prompt:'🎧',sub:t('Quel mot as-tu entendu dans la phrase ?','Which word did you hear in the sentence?'),opts:shuffle([target,...others]),answer:target,explain:`« ${l.t} » = ${l.fr}`,audio:l.t,autoplay:true,rate,hideAudioText:true,mission:'listening'};}
 if(mode==='info'){const q=infoQuestion(l);if(q)return q;}
 return {type:'mcq',key:l.key,skill:'listening',topic:'Listening : compréhension',prompt:'🎧',sub:t('Qu\'as-tu entendu ?','What did you hear?'),opts:shuffle([l.t,...distractors(same,l.t,3,'t')]),answer:l.t,explain:`« ${l.t} » = ${l.fr}`,audio:l.t,autoplay:true,rate,hideAudioText:true,mission:'listening'};}
function infoQuestion(l){const m=l.t.match(/\b(two|three|four|five|six|seven|eight|nine|ten|twenty|twelve|one|half past nine|seven months|six months|three years|two hours|two nights)\b/i);if(!m)return null;const target=m[1];const others=shuffle(['two','three','four','five','six','seven','eight','nine','ten','twelve','twenty','one'].filter(x=>!norm(target).includes(x))).slice(0,3);return {type:'mcq',key:l.key,skill:'listening',topic:'Listening : information',prompt:'🎧',sub:t('Quelle information (nombre / durée) entends-tu ?','Which piece of information (number / duration) do you hear?'),opts:shuffle([target,...others]),answer:target,explain:`« ${l.t} » = ${l.fr}`,audio:l.t,autoplay:true,rate:lvlRate(l.lvl),hideAudioText:true,mission:'listening'};}

/* --- Traduction --- */
function genTranslation(exclude,mode){const L=skillLevelIdx('translation');const tr=selectItem(TRANSLATIONS,'translation',exclude,L);if(!tr)return null;mode=mode||pick(L===0?['fr>en','fr>en','en>fr']:L===1?['fr>en','en>fr','write']:['write','write','fr>en','ctx']);
 if(mode==='ctx'){const c=selectItem(CONTEXT_TRANSLATION,'translation',exclude,L);if(c)return genContext(c);}
 if(mode==='en>fr')return {type:'build',key:tr.key,skill:'translation',topic:'Traduction EN→FR',prompt:tr.en,sub:t('Traduis en français en ordonnant les mots','Translate into French by ordering the words'),tokens:shuffle(tr.fr.replace(/[.?!]/g,'').replace(/’/g,"'").split(/\s+/)),answer:tr.fr,accepted:[tr.fr],explain:`${tr.en} = ${tr.fr}`,audio:tr.en,autoplay:true,mission:'translation'};
 if(mode==='write')return {type:'write',key:tr.key,skill:'translation',topic:'Traduction libre',prompt:tr.fr,sub:t('Écris la phrase en anglais','Write the sentence in English'),accepted:[tr.en,...tr.alt],answer:tr.en,explain:t(`Formulation attendue : ${tr.en}`+(tr.alt.length?` (ou : ${tr.alt.join(' / ')})`:''),`Expected: ${tr.en}`+(tr.alt.length?` (or: ${tr.alt.join(' / ')})`:'')),audio:tr.en,mission:'translation'};
 return {type:'build',key:tr.key,skill:'translation',topic:'Traduction FR→EN',prompt:tr.fr,sub:t('Sélectionne les mots dans le bon ordre','Select the words in the right order'),tokens:buildTokens(tr.en),answer:tr.en,accepted:[tr.en,...tr.alt],explain:`${tr.fr} = ${tr.en}`,audio:tr.en,mission:'translation'};}
function genContext(c){return {type:'write',key:c.key,skill:'translation',topic:'Traduction contextualisée',prompt:c.ctx,sub:t('Écris la phrase anglaise appropriée','Write the appropriate English sentence'),accepted:[c.en,...c.alt],answer:c.en,explain:t(`Formulation naturelle : ${c.en}`,`Natural phrasing: ${c.en}`)+(c.alt.length?`\n${t('Aussi possible','Also possible')} : ${c.alt.slice(0,2).join(' / ')}`:''),audio:c.en,mission:'translation'};}

/* --- Sons / alphabet --- */
function genSound(exclude){const pr=pick(MINIMAL_PAIRS);const target=pick([pr[0],pr[1]]);return {type:'mcq',key:'snd:'+pr[0],skill:'listening',topic:'Prononciation : paires minimales',prompt:'🎧',sub:t('Écoute et choisis le mot prononcé','Listen and choose the word you hear'),opts:shuffle([pr[0],pr[1]]),answer:target,explain:`${pr[0]} / ${pr[1]} = ${pr[2]}. ${pr[3]}`,audio:target,autoplay:true,rate:0.85,hideAudioText:true,mission:'listening'};}
function genAlphabet(){const i=Math.floor(Math.random()*26);const [L,w,fr]=ALPHABET[i];const m=Math.random();
 if(m<.34&&i<25){const nxt=ALPHABET[i+1][0];return {type:'mcq',key:'al:'+L,skill:'comprehension',topic:'Alphabet',prompt:`Which letter comes after ${L}?`,sub:t(`Quelle lettre vient après ${L} ?`,''),opts:shuffle([nxt,...shuffle(ALPHABET.map(a=>a[0]).filter(x=>x!==nxt&&x!==L)).slice(0,3)]),answer:nxt,explain:`${L} → ${nxt}`,audio:nxt,mission:'words'};}
 if(m<.67)return {type:'mcq',key:'al:'+L,skill:'comprehension',topic:'Alphabet',prompt:`Which word starts with ${L}?`,sub:t(`Quel mot commence par ${L} ?`,''),opts:shuffle([w,...shuffle(ALPHABET.filter(a=>a[0]!==L)).slice(0,3).map(a=>a[1])]),answer:w,explain:`${L} — ${w} (${fr})`,audio:w,mission:'words'};
