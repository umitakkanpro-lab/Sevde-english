/* --- Révision SRS --- */
function dueItems(){const now=Date.now();return Object.entries(S.items).filter(([k,i])=>i.m>0&&i.m<5&&i.next<=now).map(([k])=>k);}
function genFromKey(key,exclude){const [kind]=key.split(':');const ex=new Set([...exclude].filter(k=>k!==key));const force=pool=>pool.find(x=>x.key===key);
 if(kind==='v'){const w=force(VOCAB);if(!w)return null;const q=genVocab(new Set(VOCAB.map(x=>x.key).filter(k=>k!==key)));return q;}
 if(kind==='p'){return genPhrase(new Set(PHRASES.map(x=>x.key).filter(k=>k!==key)));}
 if(kind==='vb'){return genVerb(new Set(VERBS.map(x=>x.key).filter(k=>k!==key)));}
 if(kind==='e'){return genExpression(new Set(EXPRESSIONS.map(x=>x.key).filter(k=>k!==key)));}
 if(kind==='l'){return genListening(new Set(LISTENING.map(x=>x.key).filter(k=>k!==key)));}
 if(kind==='t'){return genTranslation(new Set(TRANSLATIONS.map(x=>x.key).filter(k=>k!==key)));}
 if(kind==='g'){return genGrammar(new Set(GRAMMAR_EX.map(x=>x.key).filter(k=>k!==key)));}
 return null;}
function genReview(exclude){const due=shuffle(dueItems()).filter(k=>!exclude.has(k));for(const k of due){const q=genFromKey(k,exclude);if(q){q.mission='reviews';q.isReview=true;return q;}}return null;}

/* --- Générateur "next exercise" adaptatif (algorithme de recommandation) --- */
const GEN_BY_SKILL={vocab:genVocab,grammar:genGrammar,listening:genListening,translation:genTranslation,verbs:genVerb,phrases:genPhrase,expressions:genExpression,comprehension:genPhrase};
function nextAdaptive(exclude,skillHint){
 if(skillHint&&GEN_BY_SKILL[skillHint])return GEN_BY_SKILL[skillHint](exclude);
 // 1) notions très faibles/récemment échouées (topics) 2) révisions dues 3) compétence faible 4) nouveau 5) entretien
 const r=Math.random();const wt=weakTopics();
 if(r<.25&&wt.length){const w=pick(wt.slice(0,3));const q=genForTopic(w.name,exclude);if(q)return q;}
 if(r<.45){const q=genReview(exclude);if(q)return q;}
 const weights=Object.keys(GEN_BY_SKILL).filter(s=>s!=='comprehension').map(s=>{const sc=skillScoreOr(s,60);let w=1+(100-sc)/40;if(S.profile.priority===SKILLS[s])w*=1.6;if(S.prefs.immersion&&s==='listening')w*=1.5;if(LVI(S.level)===0&&(s==='expressions'))w*=.5;return {s,w};});
 let tot=weights.reduce((a,b)=>a+b.w,0),x=Math.random()*tot;for(const {s,w} of weights){x-=w;if(x<=0)return GEN_BY_SKILL[s](exclude)||genVocab(exclude);}
 return genVocab(exclude);
}
function genForTopic(name,exclude){
 if(name.startsWith('Vocabulaire : ')){const cat=name.slice(14);const pool=VOCAB.filter(v=>v.cat===cat);const w=weightedPick(pool,c=>priority(c.key),exclude);if(!w)return null;return genVocab(new Set(VOCAB.filter(x=>x.key!==w.key).map(x=>x.key)));}
 if(name.startsWith('Phrases : ')){const sit=name.slice(10);const pool=PHRASES.filter(p=>p.sit===sit);const p=weightedPick(pool,c=>priority(c.key),exclude);if(!p)return null;return genPhrase(new Set(PHRASES.filter(x=>x.key!==p.key).map(x=>x.key)));}
 if(name.startsWith('Listening'))return genListening(exclude);
 if(name.startsWith('Traduction'))return genTranslation(exclude);
 if(name.startsWith('Verbes irr'))return genVerb(exclude,true);
 if(name.startsWith('Verbes'))return genVerb(exclude);
 if(name==='Expressions')return genExpression(exclude);
 if(name.startsWith('Prononciation'))return genSound(exclude);
 if(name==='Alphabet')return genAlphabet();
 if(GRAMMAR.some(g=>g.tag===name))return genGrammar(exclude,name);
 return null;
}

/* ---------- Session builder ---------- */
function buildSession(spec){// spec: [[genFn,count],...] → array of lazy generators
 const plan=[];spec.forEach(([fn,n])=>{for(let i=0;i<n;i++)plan.push(fn);});return shuffle(plan);}
function planDaily(){const tg=missionTargets();const d=daily().done;const rem=k=>Math.max(0,tg[k]-(d[k]||0));
 const spec=[[genVocab,rem('words')],[genReview,rem('reviews')],[genPhrase,rem('phrases')],[genGrammar,rem('grammar')],[genListening,rem('listening')],[genTranslation,rem('translation')]];
 let plan=buildSession(spec);if(!plan.length)plan=buildSession([[ex=>nextAdaptive(ex),10]]);return plan.slice(0,Math.max(8,Math.min(plan.length,Math.round(S.prefs.dailyMinutes*1.2))));}
function planQuick(){const weak=weakTopics();const g1=ex=>{if(weak.length){const q=genForTopic(pick(weak).name,ex);if(q)return q;}return genReview(ex)||nextAdaptive(ex);};
 return [g1,g1,ex=>genReview(ex)||genVocab(ex),ex=>genReview(ex)||genVocab(ex),genPhrase,genPhrase,genGrammar,genGrammar,genListening,genListening,genTranslation];}

function startSession(kind,opts={}){let plan,title;
 if(kind==='daily'){plan=planDaily();title=t('Mission du jour','Daily mission');}
 else if(kind==='quick'){plan=planQuick();title=t('Révision rapide – 5 min','Quick review – 5 min');}
 else if(kind==='errors'){const wt=weakTopics().slice(0,4);plan=[];for(let i=0;i<10;i++){const w=wt[i%wt.length];plan.push(ex=>genForTopic(w.name,ex)||nextAdaptive(ex));}title=t('Session ciblée : mes difficultés','Targeted session: my weak points');}
 else if(kind==='topic'){plan=[];for(let i=0;i<(opts.count||8);i++)plan.push(ex=>genForTopic(opts.topic,ex)||nextAdaptive(ex));title=opts.title||opts.topic;}
 else if(kind==='custom'){plan=opts.plan;title=opts.title;}
 SESSION={kind,title,plan,i:0,ok:0,ko:0,exclude:new Set(),cur:null,answered:false,back:opts.back||VIEW.tab,backSub:opts.backSub||VIEW.sub,results:[],lvlTest:opts.lvlTest||false,startedAt:Date.now()};
 S.last.label=title;S.last.tab=VIEW.tab;save();nextQuestion();}
function nextQuestion(){const s=SESSION;if(s.i>=s.plan.length){return finishSession();}let q=null;for(let tries=0;tries<4&&!q;tries++){q=s.plan[s.i](s.exclude);if(!q)q=nextAdaptive(s.exclude);}
 if(!q){finishSession();return;}s.exclude.add(q.key);s.cur=q;s.answered=false;s.built=[];s.usedIdx=[];render();}
function renderSession(){const s=SESSION,q=s.cur;const pct=Math.round(100*s.i/s.plan.length);
 const aud=q.audio?`<button class="icon-btn ${q.autoplay?'':''}" ${q.autoplay?`data-autoplay="${esc(q.audio)}" data-rate="${q.rate||''}"`:''} aria-label="Écouter" onclick="${H(ev=>speak(q.audio,{btn:ev.currentTarget,rate:q.rate}))}">🔊</button>`:'';
 const slow=q.audio&&q.skill==='listening'?`<button class="icon-btn" aria-label="Lent" title="Écouter lentement" onclick="${H(ev=>speak(q.audio,{btn:ev.currentTarget,rate:0.6}))}">🐢</button>`:'';
 let body='';
 if(q.type==='mcq'){body=`<div class="opts">${q.opts.map((o,i)=>{let cls='';if(s.answered){if(norm(o)===norm(q.answer))cls='right';else if(s.chosen===o)cls='wrong';}return `<button class="opt ${cls}" ${s.answered?'disabled':''} onclick="${H(()=>answer(o))}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`;}).join('')}</div>`;}
 else if(q.type==='build'){body=`<div class="tiles answer" aria-label="Ta réponse">${s.built.map((w,i)=>`<button class="tile" onclick="${H(()=>{if(s.answered)return;s.built.splice(i,1);s.usedIdx.splice(i,1);render();})}">${esc(w)}</button>`).join('')||`<span class="muted small" style="align-self:center">${t('Touche les mots ci-dessous…','Tap the words below…')}</span>`}</div><div class="tiles">${q.tokens.map((w,i)=>`<button class="tile ${s.usedIdx.includes(i)?'used':''}" ${s.answered?'disabled':''} onclick="${H(()=>{if(s.answered)return;s.built.push(w);s.usedIdx.push(i);render();})}">${esc(w)}</button>`).join('')}</div>${s.answered?'':`<div class="row"><button class="btn" ${s.built.length?'':'disabled'} onclick="${H(()=>answer(s.built.join(' ')))}">${t('Valider','Check')}</button><button class="btn ghost sm" onclick="${H(()=>{s.built=[];s.usedIdx=[];render();})}">${t('Effacer','Clear')}</button></div>`}`;}
 else if(q.type==='write'){body=`<form onsubmit="${H(ev=>{ev.preventDefault();const v=$('#ans').value;if(v.trim())answer(v);})}"><input id="ans" class="txt" autofocus autocomplete="off" autocapitalize="sentences" placeholder="${t('Écris ta réponse en anglais…','Write your answer in English…')}" ${s.answered?'disabled value="'+esc(s.chosen)+'"':''}>${s.answered?'':`<div class="row" style="margin-top:12px"><button class="btn" type="submit">${t('Valider','Check')}</button><button class="btn ghost sm" type="button" onclick="${H(()=>answer('__skip__'))}">${t('Je ne sais pas','I don\'t know')}</button></div>`}</form>`;}
 let fb='';if(s.answered){const ok=s.lastOk;fb=`<div class="feedback ${ok?'ok':'ko'}"><h4>${ok?t('✓ Correct !','✓ Correct!'):t('✗ Pas tout à fait','✗ Not quite')}</h4>${!ok?`<p style="font-weight:700;margin-bottom:4px">${t('Réponse attendue','Expected answer')} : ${esc(q.answer)}</p>`:''}<p class="small" style="white-space:pre-line">${esc(q.explain||'')}</p>${q.gid&&!ok?`<button class="btn sm ghost" style="margin-top:8px" onclick="${H(()=>{const back=SESSION;SESSION=null;go('grammar',q.gid,{resume:back});})}">📖 ${t('Revoir la règle','Review the rule')}</button>`:''}<div class="row between" style="margin-top:12px"><div class="row" style="gap:6px"><span class="muted small">${t('Difficulté ?','Difficulty?')}</span>${['Trop facile','Adapté','Trop difficile'].map((l,i)=>`<button class="chip" style="min-height:32px;padding:5px 10px;font-size:12px" onclick="${H(()=>feedbackDiff(q.skill,i))}">${t(l,['Too easy','Just right','Too hard'][i])}</button>`).join('')}</div><button class="btn" id="nextbtn" onclick="${H(()=>{s.i++;nextQuestion();})}">${t('Suivant','Next')} →</button></div></div>`;}
 const prompt=q.prompt==='🎧'?`<div class="ex-q big" style="text-align:center">🎧 <span class="muted" style="font-size:15px;font-weight:600">${t('Écoute attentivement','Listen carefully')}</span></div>`:`<div class="ex-q ${q.prompt.length<40?'big':''}">${esc(q.prompt)}</div>`;
 return `<div class="ex-wrap fade"><div class="ex-head"><button class="icon-btn" aria-label="Quitter" onclick="${H(()=>{if(confirm(t('Quitter la session ? Ta progression est déjà sauvegardée.','Leave the session? Your progress is already saved.'))){const b=SESSION.back,bs=SESSION.backSub;SESSION=null;go(b,bs);}})}">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="small muted" style="font-weight:700">${s.i+1}/${s.plan.length}</span></div>
 <div class="row between" style="margin-bottom:6px"><span class="pill">${q.isReview?'🔁 '+t('Révision','Review'):({vocab:'📚',grammar:'📖',listening:'🎧',translation:'🔄',verbs:'⚡',phrases:'💬',expressions:'💡',comprehension:'🧩'}[q.skill]||'📝')+' '+esc(q.topic||SKILLS[q.skill]||'')}</span>${q.audio&&!(q.hideAudioText&&!s.answered)?'':''}<span class="row" style="gap:6px">${aud}${slow}</span></div>
 <div class="card" style="padding:26px 24px"><p class="muted small" style="font-weight:600">${esc(q.sub||'')}</p>${prompt}${body}${fb}</div><p class="muted small" style="text-align:center;margin-top:12px">${s.title} · ✓ ${s.ok} · ✗ ${s.ko}</p></div>`;}
function feedbackDiff(skill,i){const sk=S.skills[skill];if(!sk)return;if(i===0){sk.adj=Math.min(1,sk.adj+1);toast(t('Noté ! J\'augmente la difficulté en '+SKILLS[skill]+' 📈','Noted! Raising difficulty in '+SKILLS[skill]+' 📈'),'gold');}else if(i===2){sk.adj=Math.max(-1,sk.adj-1);toast(t('Noté ! Je simplifie un peu en '+SKILLS[skill]+' 🧠','Noted! Simplifying '+SKILLS[skill]+' a bit 🧠'),'gold');}else toast(t('Parfait, on garde ce rythme 👍','Perfect, keeping this pace 👍'),'ok');save();}
function checkAnswer(q,val){if(val==='__skip__')return false;if(q.type==='mcq')return norm(val)===norm(q.answer);const acc=(q.accepted&&q.accepted.length?q.accepted:[q.answer]).map(norm);const v=norm(val);if(acc.includes(v))return true;// tolérance : contractions
 const expand=(s,sIs)=>s.replace(/\bi'm\b/g,'i am').replace(/\b(\w+)'re\b/g,'$1 are').replace(/\b(\w+)'s\b/g,sIs?'$1 is':'$1 has').replace(/\b(\w+)'ll\b/g,'$1 will').replace(/\b(\w+)'ve\b/g,'$1 have').replace(/\b(\w+)'d\b/g,'$1 would').replace(/\bcan't\b/g,'cannot').replace(/\bwon't\b/g,'will not').replace(/\b(\w+)n't\b/g,'$1 not');const evs=[expand(v,true),expand(v,false)];if(acc.some(a=>{const A=[expand(a,true),expand(a,false)];return A.some(x=>evs.includes(x));}))return true;const ev=evs[0];
 // tolérance légère : 1 faute de frappe sur phrase > 15 caractères
 if(v.length>15){for(const a of acc){const A=expand(a,true);if(Math.abs(A.length-ev.length)<=1&&lev(A,ev)<=1)return true;}}return false;}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));}prev=cur;}return prev[n];}
function answer(val){const s=SESSION,q=s.cur;if(s.answered)return;const ok=checkAnswer(q,val);s.answered=true;s.chosen=val;s.lastOk=ok;if(ok)s.ok++;else s.ko++;s.results.push({q,ok});
 if(s.lvlTest){render();return;}
 record({key:q.key,skill:q.skill,topic:q.topic,ok,lvl:q.lvl});if(q.mission)mission(q.mission);
 if(ok&&q.audio&&q.type!=='mcq')setTimeout(()=>speak(q.audio),300);
 render();if(ok){setTimeout(()=>{const b=$('#nextbtn');if(b)b.focus();},50);}}
function finishSession(){const s=SESSION;const total=s.ok+s.ko;const pct=total?Math.round(100*s.ok/total):0;if(!s.lvlTest){if(total>=5&&pct===100){S.stats.perfect++;addXP(XP.perfect);confetti();}if(pct>S.stats.best&&total>=5)S.stats.best=pct;S.sessions.unshift({date:Date.now(),title:s.title,ok:s.ok,ko:s.ko});S.sessions=S.sessions.slice(0,50);if(s.kind==='quick'||s.kind==='errors')S.stats.sessions++;checkBadges();save();}
 s.done=true;s.pct=pct;render();}
document.addEventListener('keydown',e=>{if(!SESSION||SESSION.done)return;const q=SESSION.cur;if(!q)return;if(e.key==='Enter'&&SESSION.answered){const b=$('#nextbtn');if(b){e.preventDefault();b.click();}}if(q.type==='mcq'&&!SESSION.answered&&/^[1-4]$/.test(e.key)){const o=q.opts[parseInt(e.key)-1];if(o)answer(o);}});

const _renderSession=renderSession;renderSession=function(){const s=SESSION;if(!s.done)return _renderSession();if(s.lvlTest)return renderLevelTestResult();
 const msg=s.pct===100?t('QUIZ PARFAIT ! 🏆 +100 XP','PERFECT QUIZ! 🏆 +100 XP'):s.pct>=80?t('Excellent travail, Sevde ! 🔥','Excellent work, Sevde! 🔥'):s.pct>=60?t('Bien joué, on progresse 💪','Well done, progressing 💪'):t('Chaque erreur nous montre quoi travailler ❤️','Every mistake shows us what to work on ❤️');
 const wrong=s.results.filter(r=>!r.ok);
 return `<div class="ex-wrap fade"><div class="card" style="text-align:center;padding:36px 24px"><div class="pct">${s.pct} %</div><h2 style="margin:6px 0 4px">${msg}</h2><p class="muted">${s.title} · ${s.ok} ✓ · ${s.ko} ✗ · ${Math.round((Date.now()-s.startedAt)/60000)||1} min</p><p style="margin-top:14px;font-size:17px">« Umit est très fier de toi ❤️<br>Tout est dans le brain 🧠 »</p>
 <div class="row" style="justify-content:center;margin-top:22px;gap:10px"><button class="btn" onclick="${H(()=>{const k=s.kind,o={topic:s.plan.topic};SESSION=null;if(k==='custom')go(s.back,s.backSub);else startSession(k,{topic:s.title,title:s.title});})}">🔁 ${t('Nouvelle session','New session')}</button><button class="btn sec" onclick="${H(()=>{const b=s.back,bs=s.backSub;SESSION=null;go(b,bs);})}">${t('Terminer','Done')}</button></div></div>
 ${wrong.length?`<div class="card" style="margin-top:14px"><div class="section-title">${t('À revoir','To review')}</div>${wrong.map(r=>`<div class="list-item" style="border:0;padding:8px 0;border-bottom:1px solid var(--line)"><div class="body"><div style="font-weight:700">${esc(r.q.answer)}</div><div class="small muted">${esc(r.q.prompt)}</div></div>${r.q.audio?audioBtn(r.q.audio):''}</div>`).join('')}</div>`:''}</div>`;};

 <div class="grid3">${VOCAB_CATS.map(c=>{const n=c.items.filter(w=>(S.items[w.key]||{}).learned||(S.items[w.key]||{}).m>=4).length;return `<button class="cat-btn" onclick="${H(()=>go('vocab',c.name))}"><span class="ic">${c.icon}</span><span class="body"><b>${c.name} <span class="tag ${c.lvl}">${c.lvl}</span></b><span>${n} / ${c.items.length} ${t('appris','learned')}</span><div class="bar thin ${n===c.items.length?'ok':''}" style="margin-top:6px"><i style="width:${100*n/c.items.length}%"></i></div></span></button>`;}).join('')}</div></div>`;}
function renderVocabCat(cat){const learned=w=>(S.items[w.key]||{}).learned||(S.items[w.key]||{}).m>=4;const n=cat.items.filter(learned).length;S.last.label=t('Vocabulaire : ','Vocabulary: ')+cat.name;

 <div class="row" style="margin-bottom:16px"><button class="btn" onclick="${H(()=>startSession('topic',{topic:'Vocabulaire : '+cat.name,title:t('Quiz : ','Quiz: ')+cat.name,count:10,back:'vocab',backSub:cat.name}))}">▶ ${t('M\'entraîner sur cette catégorie','Practise this category')}</button><button class="btn sec" onclick="${H(()=>{const words=cat.items.map(w=>w.en).join('. ');speak(words,{rate:.85});})}">🔊 ${t('Tout écouter','Listen to all')}</button></div>
 <div class="grid3">${cat.items.map(w=>{const it=S.items[w.key]||{m:0};const l=learned(w);return `<div class="card vocab-card ${l?'learned':''}"><div class="row between"><span class="en">${esc(w.en)}</span>${audioBtn(w.en,0.9)}</div><span class="fr ${S.prefs.immersion?'hidden-fr':''}" onclick="${H(ev=>ev.currentTarget.classList.toggle('show'))}">${esc(w.fr)}</span><div class="exm row between" style="gap:6px"><span>${esc(w.ex)}</span><button class="icon-btn" style="width:32px;height:32px;font-size:14px" onclick="${spk(w.ex,0.9)}">🔊</button></div><div class="row between"><label class="check"><input type="checkbox" ${l?'checked':''} onchange="${H(ev=>{const it=getItem(w.key);it.learned=ev.target.checked;if(it.learned&&it.m<3){it.m=3;it.next=Date.now()+SRS_INTERVALS[3];addXP(XP.newItem);mission('words');}if(cat.items.every(x=>(S.items[x.key]||{}).learned||(S.items[x.key]||{}).m>=4)&&!S.learnedCats.includes(cat.name)){S.learnedCats.push(cat.name);addXP(XP.category);confetti();toast(`🏅 Catégorie « ${cat.name} » terminée ! +150 XP\nUmit est très fier de toi ❤️`,'gold',3500);}save();checkBadges();render();})}> ${t('J\'ai appris ce mot','I learned this word')}</label><span class="m-dots" title="Maîtrise ${it.m}/5">${[1,2,3,4,5].map(i=>`<i class="${it.m>=i?'on':''}"></i>`).join('')}</span></div></div>`;}).join('')}</div></div>`;}

 <div class="stack" style="gap:8px">${list.map(p=>{const it=S.items[p.key]||{};return `<div class="list-item"><span class="tag ${p.lvl}">${p.lvl}</span><div class="body"><div style="font-weight:700;font-size:16px">${esc(p.en)}</div><div class="small muted ${S.prefs.immersion?'hidden-fr':''}" onclick="${H(ev=>ev.currentTarget.classList.toggle('show'))}">${esc(p.fr)}</div></div>${audioBtn(p.en,lvlRate(p.lvl))}<button class="chip ${it.known?'active':''}" style="min-height:36px;padding:6px 10px;font-size:12px" onclick="${H(()=>{const i=getItem(p.key);i.known=!i.known;if(i.known){i.m=Math.max(i.m,4);i.next=Date.now()+SRS_INTERVALS[4];addXP(XP.newItem);mission('phrases');}save();checkBadges();render();})}">${it.known?'✓ ':''}${t('Je connais','I know it')}</button><button class="chip ${it.review?'active':''}" style="min-height:36px;padding:6px 10px;font-size:12px" onclick="${H(()=>{const i=getItem(p.key);i.review=!i.review;i.known=false;if(i.review){i.m=2;i.next=Date.now();i.lastKo=Date.now();}save();render();})}">${t('À revoir','Review')}</button></div>`;}).join('')}</div></div>`;}

 ${LV.map(l=>`<div class="section-title" style="margin-top:18px"><span class="tag ${l}">${l}</span> ${({A1:t('Survie et bases','Survival & basics'),A2:t('Conversation quotidienne','Everyday conversation'),B1:t('Autonomie','Independence'),B2:t('Anglais naturel et professionnel','Natural & professional English')})[l]}</div><div class="grid2">${GRAMMAR.filter(g=>g.lvl===l).map(g=>{const tr=S.topics[g.tag];const sc=tr&&(tr.ok+tr.ko)?Math.round(100*tr.ok/(tr.ok+tr.ko)):null;return `<button class="cat-btn" onclick="${H(()=>go('grammar',g.id))}"><span class="ic">📖</span><span class="body"><b>${g.title}</b><span>${g.ex.length} ${t('exercices','exercises')}${sc!=null?` · ${sc} %`:''}</span>${sc!=null?`<div class="bar thin" style="margin-top:6px"><i style="width:${sc}%"></i></div>`:''}</span></button>`;}).join('')}</div>`).join('')}</div>`;}

 <div class="row" style="margin-top:16px"><button class="btn" onclick="${H(()=>startSession('custom',{plan:shuffle(g.ex).map(e=>()=>({type:'mcq',key:e.key,skill:'grammar',topic:g.tag,prompt:e.q.replace(/___/g,'_____'),sub:/mistake/i.test(e.q)?t('Trouve la phrase incorrecte','Find the incorrect sentence'):t('Choisis la bonne réponse','Choose the right answer'),opts:shuffle(e.opts),answer:e.a,explain:e.ex,gid:g.id,mission:'grammar'})),title:t('Mini-test : ','Mini-test: ')+g.title,back:'grammar',backSub:g.id}))}">📝 ${t('Mini-test','Mini-test')} (${g.ex.length})</button></div></div>`;}

function renderListening(){const rateBtns=[0.75,1,1.25,1.5].map(r=>`<button class="${S.prefs.rate===r?'active':''}" onclick="${H(()=>{S.prefs.rate=r;save();render();})}">${r}x</button>`).join('');
 const accBtns=[['en-US','🇺🇸 American'],['en-GB','🇬🇧 British']].map(([a,l])=>`<button class="${S.prefs.accent===a?'active':''}" onclick="${H(()=>{S.prefs.accent=a;save();render();})}">${l}</button>`).join('');
 const modes=[['choose',t('Choisis ce que tu as entendu','Choose what you heard')],['fill',t('Complète la phrase','Complete the sentence')],['translate',t('Traduis','Translate')],['word',t('Identifie un mot','Identify a word')],['info',t('Identifie une information','Identify information')]];

 <div class="card" style="margin-bottom:14px"><div class="row between"><div><div class="section-title">${t('Vitesse audio','Audio speed')}</div><div class="seg">${rateBtns}</div></div><div><div class="section-title">${t('Voix','Voice')}</div><div class="seg">${accBtns}</div></div></div></div>

 <div class="section-title" style="margin-top:20px">${t('Bibliothèque audio','Audio library')}</div><div class="stack" style="gap:8px">${LV.map(l=>`<details class="card" style="padding:12px 18px"><summary>${l} · ${LISTENING.filter(x=>x.lvl===l).length} ${t('phrases','sentences')}</summary>${LISTENING.filter(x=>x.lvl===l).map(x=>`<div class="list-item" style="border:0;padding:8px 0;border-bottom:1px solid var(--line)"><div class="body"><div style="font-weight:600">${esc(x.t)}</div><div class="small muted ${S.prefs.immersion?'hidden-fr':''}" onclick="${H(ev=>ev.currentTarget.classList.toggle('show'))}">${esc(x.fr)}</div></div>${audioBtn(x.t,lvlRate(x.lvl))}</div>`).join('')}</details>`).join('')}</div></div>`;}

/* ---------- Conversation ---------- */
let CONV=null;
function renderConversation(){if(CONV)return renderConvRun();const L=LVI(S.level);
 return `<div class="fade"><h1>🗣️ Conversation</h1><p class="muted" style="margin-bottom:14px">${t('Simulations de dialogues. Choisis la meilleure réponse : je t\'explique pourquoi et je te propose une formulation plus naturelle.','Dialogue simulations. Pick the best answer: I explain why and suggest a more natural phrasing.')}</p>
 <div class="grid2">${CONVERSATIONS.map(c=>{const tr=S.topics['Conversation : '+c.title];const sc=tr&&(tr.ok+tr.ko)?Math.round(100*tr.ok/(tr.ok+tr.ko)):null;return `<button class="cat-btn" onclick="${H(()=>{CONV={c,i:0,log:[],ok:0,answered:null};S.last.label='Conversation : '+c.title;save();render();})}"><span class="ic">${c.icon}</span><span class="body"><b>${c.title} <span class="tag ${c.lvl}">${c.lvl}</span></b><span>${c.steps.length} ${t('échanges','exchanges')}${sc!=null?` · ${sc} %`:''}</span></span></button>`;}).join('')}</div></div>`;}
function renderConvRun(){const {c,i,log}=CONV;const step=c.steps[i];const done=i>=c.steps.length;
 return `<div class="fade ex-wrap"><button class="back" onclick="${H(()=>{CONV=null;render();})}">← ${t('Conversations','Conversations')}</button><div class="row between"><h2>${c.icon} ${c.title}</h2><span class="small muted">${Math.min(i+1,c.steps.length)}/${c.steps.length}</span></div><div class="bar thin" style="margin:10px 0 16px"><i style="width:${100*i/c.steps.length}%"></i></div>
 <div class="convo">${log.map(l=>`<div class="bubble npc"><span class="who">${t('Interlocuteur','Speaker')}</span>${esc(l.npc)}</div><div class="bubble me"><span class="who">Sevde</span>${esc(l.me)}</div>`).join('')}${!done?`<div class="bubble npc" style="display:flex;gap:10px;align-items:center"><span><span class="who">${t('Interlocuteur','Speaker')}</span>${esc(step.npc)}</span><button class="icon-btn" style="width:34px;height:34px;font-size:14px" data-autoplay="${esc(step.npc)}" onclick="${spk(step.npc)}">🔊</button></div>`:''}</div>
 ${done?`<div class="card" style="text-align:center"><h3>${t('Conversation terminée !','Conversation finished!')}</h3><p class="muted">${CONV.ok} / ${c.steps.length} ${t('réponses idéales','ideal answers')}</p><p style="margin:10px 0">« Umit est très fier de toi ❤️ »</p><div class="row" style="justify-content:center"><button class="btn" onclick="${H(()=>{CONV=null;render();})}">${t('Terminer','Done')}</button><button class="btn sec" onclick="${H(()=>{speak(c.steps.map(s=>s.npc+'. '+(s.opts.find(o=>o.ok)||{}).t).join(' '),{rate:.95});})}">🔊 ${t('Écouter le dialogue complet','Listen to the full dialogue')}</button></div></div>`:
 `<div class="card"><p class="muted small" style="font-weight:600;margin-bottom:10px">${t('Ta réponse :','Your answer:')}</p><div class="opts">${step.opts.map((o,k)=>{let cls='';const a=CONV.answered;if(a){if(o.ok)cls='right';else if(a.t===o.t)cls='wrong';}return `<button class="opt ${cls}" ${a?'disabled':''} onclick="${H(()=>{if(CONV.answered)return;CONV.answered=o;if(o.ok)CONV.ok++;record({key:`cv:${c.id}:${i}`,skill:'conversation',topic:'Conversation : '+c.title,ok:o.ok});render();})}"><span class="k">${'ABC'[k]}</span><span>${esc(o.t)}</span></button>`;}).join('')}</div>
 ${CONV.answered?`<div class="feedback ${CONV.answered.ok?'ok':'ko'}"><h4>${CONV.answered.ok?t('✓ Bonne réponse','✓ Correct'):t('✗ Pas la meilleure option','✗ Not the best option')}</h4><p class="small">${esc(CONV.answered.why)}</p>${CONV.answered.better||!CONV.answered.ok?`<p class="small" style="margin-top:6px">💬 ${t('Formulation naturelle','Natural phrasing')} : <b>${esc(CONV.answered.better||step.opts.find(o=>o.ok).t)}</b> ${audioBtn(CONV.answered.better||step.opts.find(o=>o.ok).t)}</p>`:''}<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="nextbtn" onclick="${H(()=>{const me=CONV.answered.ok?CONV.answered.t:(CONV.answered.better||step.opts.find(o=>o.ok).t);CONV.log.push({npc:step.npc,me});CONV.i++;CONV.answered=null;if(CONV.i>=c.steps.length){mission('convo');}render();})}">${t('Continuer','Continue')} →</button></div></div>`:''}</div>`}</div>`;}

/* ---------- Progression ---------- */
let PROG_RANGE=7;

 </div>
 <div class="grid2" style="margin-top:14px">${chart('ex',t('Exercices par jour','Exercises per day'),max)}${chart('xp',t('XP par jour','XP per day'),Math.max(1,...data.map(x=>x.xp)))}</div>
 <div class="card" style="margin-top:14px"><div class="section-title">${t('Niveau par compétence','Level by skill')}</div>${Object.keys(SKILLS).map(s=>{const sc=skillScore(s);return `<div class="skill-row"><b>${SKILLS[s]}</b><div class="bar thin ${sc>=75?'ok':''}"><i style="width:${sc||0}%"></i></div><span style="text-align:right;font-weight:700">${sc==null?'—':sc+' %'}</span><span class="tag ${LV[skillLevelIdx(s)]}">${skillLevelLabel(s)}</span></div>`;}).join('')}<p class="small muted" style="margin-top:8px">${t('Score = réussite sur les 30 dernières réponses de la compétence. Le niveau par compétence peut différer du niveau général.','Score = success rate on the last 30 answers for that skill. Skill level may differ from overall level.')}</p></div>

function renderErrors(){const wt=weakTopics();const weakItems=Object.entries(S.items).filter(([k,i])=>i.ko>=1&&i.m<=3).sort((a,b)=>b[1].ko-a[1].ko).slice(0,30).map(([k,i])=>({k,i,obj:findItem(k)})).filter(x=>x.obj);

 ${wt.length?`<div class="row" style="margin-bottom:14px"><button class="btn" onclick="${H(()=>startSession('errors'))}">🎯 ${t('Session sur toutes mes difficultés','Session on all my weak points')}</button></div><div class="section-title">${t('TES DIFFICULTÉS ACTUELLES','YOUR CURRENT WEAK POINTS')}</div><div class="stack" style="gap:8px">${wt.map(w=>`<div class="list-item"><span style="font-size:20px">❌</span><div class="body"><b>${esc(w.name)}</b><div class="small muted">${w.ko} ${t('erreur(s)','mistake(s)')} · ${t('score','score')} ${w.score} % · ${t('dernière erreur','last mistake')} : ${w.lastKo?timeAgo(w.lastKo):'—'}</div><div class="bar thin" style="margin-top:6px;max-width:220px"><i style="width:${w.score}%"></i></div></div><button class="btn sm" onclick="${H(()=>startSession('topic',{topic:w.name,title:t('Travail ciblé : ','Targeted work: ')+w.name,count:8,back:'errors'}))}">${t('Travailler','Work on it')}</button></div>`).join('')}</div>`:`<div class="card" style="text-align:center;padding:36px"><div style="font-size:40px">🌟</div><h3>${t('Aucune difficulté détectée pour l\'instant','No weak points detected yet')}</h3><p class="muted">${t('Fais quelques exercices : j\'analyserai tes erreurs ici.','Do a few exercises: I\'ll analyse your mistakes here.')}</p></div>`}
 ${weakItems.length?`<div class="section-title" style="margin-top:20px">${t('Éléments à consolider','Items to consolidate')}</div><div class="grid2">${weakItems.map(x=>`<div class="list-item"><div class="body"><b>${esc(x.obj.label)}</b><div class="small muted">${esc(x.obj.sub)} · ${x.i.ko} ✗ · ${t('maîtrise','mastery')} ${x.i.m}/5</div></div>${x.obj.audio?audioBtn(x.obj.audio):''}</div>`).join('')}</div>`:''}</div>`;}
function findItem(k){const [kind]=k.split(':');let o;if(kind==='v'){o=VOCAB.find(x=>x.key===k);return o&&{label:o.en,sub:o.fr,audio:o.en};}if(kind==='p'){o=PHRASES.find(x=>x.key===k);return o&&{label:o.en,sub:o.fr,audio:o.en};}if(kind==='vb'){o=VERBS.find(x=>x.key===k);return o&&{label:`${o.base} → ${o.past} → ${o.pp}`,sub:o.fr,audio:`${o.base}, ${o.past}, ${o.pp}`};}if(kind==='e'){o=EXPRESSIONS.find(x=>x.key===k);return o&&{label:o.en,sub:o.fr,audio:o.en};}if(kind==='l'){o=LISTENING.find(x=>x.key===k);return o&&{label:o.t,sub:o.fr,audio:o.t};}if(kind==='t'){o=TRANSLATIONS.find(x=>x.key===k);return o&&{label:o.en,sub:o.fr,audio:o.en};}if(kind==='g'){o=GRAMMAR_EX.find(x=>x.key===k);return o&&{label:o.q,sub:o.topic+' → '+o.a};}if(kind==='c'){o=CONTEXT_TRANSLATION.find(x=>x.key===k);return o&&{label:o.en,sub:o.ctx,audio:o.en};}return null;}
function timeAgo(ts){const m=Math.round((Date.now()-ts)/60000);if(m<60)return t(`il y a ${m} min`,`${m} min ago`);const h=Math.round(m/60);if(h<24)return t(`il y a ${h} h`,`${h} h ago`);return t(`il y a ${Math.round(h/24)} j`,`${Math.round(h/24)} d ago`);}

function exportProgress(){saveNow();const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sevde-english-${todayStr()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(t('Progression exportée ✓','Progress exported ✓'),'ok');}
function importProgress(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.profile||!d.skills)throw 0;if(confirm(t('Remplacer la progression actuelle par ce fichier ?','Replace current progress with this file?'))){S=deepMerge(defaultState(),d);saveNow();render();toast(t('Progression importée ✓','Progress imported ✓'),'gold');}}catch(e){toast(t('Fichier invalide','Invalid file'),'ko');}};r.readAsText(f);}
function resetProgress(){if(!confirm(t('⚠️ Réinitialiser TOUTE la progression ? Cette action est irréversible.','⚠️ Reset ALL progress? This cannot be undone.')))return;if(!confirm(t('Vraiment sûre ? Pense à exporter avant.','Really sure? Consider exporting first.')))return;S=defaultState();ONB={step:0};saveNow();render();}

/* ---------- Test de niveau ---------- */
function renderLevelTest(){const lt=S.levelTest;return `<div class="fade ex-wrap"><button class="back" onclick="${H(()=>go('home'))}">← ${t('Accueil','Home')}</button><h1>🎓 ${t('Test de niveau','Level test')}</h1><p class="muted" style="margin:8px 0 16px">${t('24 questions : vocabulaire, grammaire, compréhension écrite, listening, traduction. Environ 10 minutes. Le résultat crée automatiquement ton plan personnalisé.','24 questions: vocabulary, grammar, reading, listening, translation. About 10 minutes. The result automatically creates your personalised plan.')}</p>
 ${lt?`<div class="card tint-mint" style="margin-bottom:14px"><div class="section-title">${t('Dernier résultat','Last result')}</div><div class="row between"><span>${new Date(lt.date).toLocaleDateString('fr-FR')}</span><span class="lvlbadge">${lt.level}</span></div><div class="small" style="margin-top:8px">${Object.entries(lt.scores).map(([k,v])=>`${k} : ${v} %`).join(' · ')}</div></div>`:''}
 <button class="btn full" onclick="${H(startLevelTest)}">▶ ${t('Commencer le test','Start the test')}</button></div>`;}
function startLevelTest(){const plan=[];const lv=['A1','A2','B1','B2'];
 const fixed=(pool,skill,mk)=>lv.forEach(l=>{const items=shuffle(pool.filter(x=>x.lvl===l));items.slice(0,1).forEach(x=>plan.push(ex=>mk(x)));});
 fixed(VOCAB,'vocab',w=>({type:'mcq',key:w.key,skill:'vocab',topic:'Test',prompt:w.en,sub:t('Que signifie ce mot ?','Meaning?'),opts:shuffle([w.fr,...distractors(VOCAB,w.fr,3,'fr')]),answer:w.fr,explain:`${w.en} = ${w.fr}`,lvl:w.lvl,section:'Vocabulaire'}));
 lv.forEach(l=>{shuffle(GRAMMAR_EX.filter(e=>e.lvl===l)).slice(0,2).forEach(e=>plan.push(()=>({type:'mcq',key:e.key,skill:'grammar',topic:'Test',prompt:e.q,sub:t('Choisis','Choose'),opts:shuffle(e.opts),answer:e.a,explain:e.ex,lvl:l,section:'Grammaire'})));});
 fixed(PHRASES,'comprehension',p=>({type:'mcq',key:p.key,skill:'comprehension',topic:'Test',prompt:p.en,sub:t('Quelle est la traduction ?','Translation?'),opts:shuffle([p.fr,...distractors(PHRASES,p.fr,3,'fr')]),answer:p.fr,explain:`${p.en} = ${p.fr}`,lvl:p.lvl,section:'Compréhension'}));
 lv.forEach(l=>{shuffle(LISTENING.filter(x=>x.lvl===l)).slice(0,2).forEach(x=>plan.push(()=>({type:'mcq',key:x.key,skill:'listening',topic:'Test',prompt:'🎧',sub:t('Qu\'as-tu entendu ?','What did you hear?'),opts:shuffle([x.t,...distractors(LISTENING.filter(y=>y.lvl===l),x.t,3,'t')]),answer:x.t,explain:x.fr,audio:x.t,autoplay:true,rate:lvlRate(l),hideAudioText:true,lvl:l,section:'Listening'})));});
 fixed(TRANSLATIONS,'translation',tr=>({type:'build',key:tr.key,skill:'translation',topic:'Test',prompt:tr.fr,sub:t('Ordonne les mots','Order the words'),tokens:buildTokens(tr.en),answer:tr.en,accepted:[tr.en,...tr.alt],explain:tr.en,lvl:tr.lvl,section:'Traduction'}));
 // ordre : par niveau croissant
 const ordered=plan.map(f=>f(new Set())).sort((a,b)=>LVI(a.lvl)-LVI(b.lvl)).map(q=>()=>q);
 startSession('custom',{plan:ordered,title:t('Test de niveau','Level test'),lvlTest:true,back:'home'});}
function renderLevelTestResult(){const s=SESSION;if(!s.evaluated){const bySec={},byLvl={};s.results.forEach(r=>{const sec=r.q.section,l=r.q.lvl;bySec[sec]=bySec[sec]||[0,0];bySec[sec][1]++;if(r.ok)bySec[sec][0]++;byLvl[l]=byLvl[l]||[0,0];byLvl[l][1]++;if(r.ok)byLvl[l][0]++;});
 const scores=Object.fromEntries(Object.entries(bySec).map(([k,v])=>[k,Math.round(100*v[0]/v[1])]));let level='A1';for(const l of LV){const v=byLvl[l];if(v&&v[0]/v[1]>=.6)level=l;else break;}
 const strengths=Object.entries(scores).filter(([,v])=>v>=70).map(([k])=>k),weak=Object.entries(scores).filter(([,v])=>v<70).map(([k])=>k);
 S.levelTest={date:Date.now(),level,scores,strengths,weak};S.level=level;const map={Vocabulaire:'vocab',Grammaire:'grammar',Listening:'listening',Traduction:'translation',Compréhension:'comprehension'};
 // alimente les compétences avec les résultats du test et met la priorité sur le point faible
 s.results.forEach(r=>{const sk=map[r.q.section];if(sk){S.skills[sk].hist.push(r.ok);}});
 if(weak.length){const w=weak.sort((a,b)=>scores[a]-scores[b])[0];if(['Vocabulaire','Grammaire','Listening','Traduction'].includes(w))S.profile.priority=w;}
 addXP(50);s.evaluated=true;S.stats.exercises+=s.results.length;S.stats.correct+=s.ok;S.stats.wrong+=s.ko;checkBadges();save();confetti();}
 const lt=S.levelTest;return `<div class="ex-wrap fade"><div class="card" style="text-align:center;padding:36px 24px"><div class="section-title">${t('Ton niveau estimé','Your estimated level')}</div><div class="lvlbadge" style="font-size:40px;padding:12px 28px;margin:8px 0 14px">${lt.level}</div><p class="muted">${s.ok}/${s.results.length} ${t('bonnes réponses','correct answers')}</p>
 <div class="grid2" style="margin-top:20px;text-align:left"><div class="card tint-mint"><div class="section-title">${t('Points forts','Strengths')}</div>${lt.strengths.length?lt.strengths.map(k=>`<div>✓ ${k} (${lt.scores[k]} %)</div>`).join(''):`<div class="muted small">${t('À construire !','To build!')}</div>`}</div><div class="card tint-rose"><div class="section-title">${t('À améliorer','To improve')}</div>${lt.weak.length?lt.weak.map(k=>`<div>→ ${k} (${lt.scores[k]} %)</div>`).join(''):`<div class="muted small">${t('Rien de critique 🎉','Nothing critical 🎉')}</div>`}</div></div>
 <div class="card" style="margin-top:14px;text-align:left"><div class="section-title">${t('Ton plan personnalisé','Your personalised plan')}</div><p>📌 ${t('Niveau de départ','Starting level')} : <b>${lt.level}</b> · ${t('Priorité','Priority')} : <b>${S.profile.priority}</b></p><p class="small muted" style="margin-top:6px">${t('Ta mission quotidienne insistera sur','Your daily mission will focus on')} ${lt.weak.length?lt.weak.join(', ').toLowerCase():t('un parcours équilibré','a balanced path')}. ${t('La difficulté s\'ajustera à chaque compétence indépendamment.','Difficulty will adjust to each skill independently.')}</p></div>
 <div class="row" style="justify-content:center;margin-top:20px"><button class="btn" onclick="${H(()=>{SESSION=null;go('home');})}">${t('Voir mon tableau de bord','See my dashboard')}</button><button class="btn sec" onclick="${H(()=>{SESSION=null;startSession('daily');})}">▶ ${t('Commencer la mission','Start the mission')}</button></div></div></div>`;}

/* ---------- JE PARLE ---------- */
let SPK={i:0,list:null,heard:'',score:null,listening:false,rec:null};
function renderSpeak(){if(!SPK.list){const L=LVI(S.level);SPK.list=shuffle(PHRASES.filter(p=>LVI(p.lvl)<=L+1)).slice(0,10);SPK.i=0;}
 const p=SPK.list[SPK.i];const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const avail=!!SR;
 return `<div class="fade ex-wrap"><button class="back" onclick="${H(()=>{stopRec();SPK={i:0,list:null};go('home');})}">← ${t('Accueil','Home')}</button><h1>🎤 ${t('JE PARLE','I SPEAK')}</h1><p class="muted" style="margin:6px 0 14px">${avail?t('Lis la phrase à voix haute. La reconnaissance vocale de ton navigateur va t\'écouter.','Read the sentence aloud. Your browser\'s speech recognition will listen.'):t('La reconnaissance vocale n\'est pas disponible sur ce navigateur : mode « écouter puis répéter ».','Speech recognition is not available in this browser: "listen then repeat" mode.')}</p>
 <div class="card" style="text-align:center;padding:30px 22px"><span class="tag ${p.lvl}">${p.lvl}</span><div class="ex-q big" style="margin:12px 0 4px">${esc(p.en)}</div><p class="muted ${S.prefs.immersion?'hidden-fr':''}" onclick="${H(ev=>ev.currentTarget.classList.toggle('show'))}">${esc(p.fr)}</p>
 <div class="row" style="justify-content:center;margin:18px 0">${audioBtn(p.en,S.prefs.rate)}<button class="icon-btn" title="Lent" onclick="${spk(p.en,0.6)}">🐢</button></div>
 ${avail?`<button class="mic ${SPK.listening?'on':''}" aria-label="Parler" onclick="${H(()=>SPK.listening?stopRec():startRec(p))}">${SPK.listening?'⏹':'🎤'}</button><p class="small muted" style="margin-top:8px">${SPK.listening?t('Je t\'écoute…','Listening…'):t('Touche le micro et lis la phrase','Tap the mic and read the sentence')}</p>`:`<p class="small muted">1. ${t('Écoute','Listen')} 🔊 &nbsp; 2. ${t('Répète à voix haute','Repeat aloud')} 🗣️ &nbsp; 3. ${t('Réécoute et compare','Listen again and compare')}</p>`}
 ${SPK.heard?`<div class="feedback ${SPK.score>=70?'ok':'ko'}" style="text-align:left"><h4>${SPK.score>=70?t('✓ Très bien !','✓ Very good!'):t('Presque !','Almost!')} ${SPK.score} % ${t('de correspondance','match')}</h4><p class="small">${t('J\'ai entendu','I heard')} : « ${esc(SPK.heard)} »</p></div>`:''}
 <div class="row" style="justify-content:center;margin-top:18px"><button class="btn sec" onclick="${H(()=>{stopRec();SPK.i=(SPK.i+1)%SPK.list.length;SPK.heard='';SPK.score=null;render();})}">${t('Phrase suivante','Next sentence')} →</button>${!avail?`<button class="btn" onclick="${H(()=>{record({key:p.key,skill:'phrases',topic:'Prononciation : je parle',ok:true});SPK.i=(SPK.i+1)%SPK.list.length;render();})}">✓ ${t('Je l\'ai répétée','I repeated it')}</button>`:''}</div></div></div>`;}
function startRec(p){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;try{const r=new SR();r.lang=S.prefs.accent;r.interimResults=false;r.maxAlternatives=3;SPK.rec=r;SPK.listening=true;render();
 r.onresult=e=>{const alts=Array.from(e.results[0]).map(a=>a.transcript);let best=0,bh=alts[0]||'';alts.forEach(h=>{const sc=similarity(h,p.en);if(sc>best){best=sc;bh=h;}});SPK.heard=bh;SPK.score=Math.round(best*100);SPK.listening=false;record({key:p.key,skill:'phrases',topic:'Prononciation : je parle',ok:SPK.score>=70});render();};
 r.onerror=e=>{SPK.listening=false;render();if(e.error==='not-allowed')toast(t('Micro refusé. Autorise le micro dans ton navigateur.','Microphone denied. Allow it in your browser.'),'ko',3500);else if(e.error!=='aborted')toast(t('Je n\'ai rien entendu, réessaie 🎤','I didn\'t hear anything, try again 🎤'),'ko');};
 r.onend=()=>{if(SPK.listening){SPK.listening=false;render();}};r.start();}catch(e){SPK.listening=false;toast(t('Reconnaissance vocale indisponible','Speech recognition unavailable'),'ko');render();}}
function stopRec(){try{if(SPK.rec)SPK.rec.stop();}catch(e){}SPK.listening=false;}
function similarity(a,b){const A=tokens(a),B=tokens(b);if(!B.length)return 0;let hit=0;const used=new Set();A.forEach(w=>{const j=B.findIndex((x,i)=>!used.has(i)&&(x===w||lev(x,w)<=1));if(j>=0){used.add(j);hit++;}});return hit/Math.max(A.length,B.length);}
